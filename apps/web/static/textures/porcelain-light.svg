<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Stitched, irregular crossing fibres; no periodic line lattice. -->
  <filter id="weave" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".61 .27" numOctaves="3" seed="17" stitchTiles="stitch" result="warp"/>
    <feTurbulence type="fractalNoise" baseFrequency=".24 .67" numOctaves="3" seed="31" stitchTiles="stitch"/>
    <feBlend in="warp" mode="multiply"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.40 0 0 0 0 0.32 0 0 0 0 0.23 0.085 0 0 0 0"/>
  </filter>
  <path d="M0 0h192v192H0z" filter="url(#weave)"/>
</svg>
