[package]
name = "weltgewebe-api"
default-run = "weltgewebe-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
authors = ["commonThing Team"]
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
async-trait = "0.1"
async-nats = "0.49"
base64 = "0.22"
dotenvy = "0.15"
ed25519-dalek = "2.1"
futures-util = "0.3"
prometheus = "0.14.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.1", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "migrate", "macros", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Used by `apps::api::config` to read YAML configuration defaults and files.
serde_yaml = "0.9"
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.19.0", features = ["v4", "v5", "fast-rng", "serde"] }
axum-extra = { version = "0.12", features = ["cookie"] }
time = "0.3.45"
ipnet = "2.11.0"
sha2 = "0.11.0"
hex = "0.4"
governor = "0.10"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
thiserror = "2.0.18"
tower-http = { version = "0.7.0", features = ["request-id", "util"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
url = "2"
serde_jcs = "0.1"
unicode-normalization = "0.1"
p256 = { version = "0.13.2", features = ["ecdsa"] }
# 0.5 requires Rust 1.87; the repository contract is Rust 1.85. Keep only the
# RFC 8291 payload encryption here; VAPID is signed locally to avoid a broad
# general-purpose JWT and post-quantum dependency stack.
web-push-native = { version = "=0.4.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Enables test-helper APIs (e.g. token introspection) used by integration tests.
# Must never be enabled in production builds.
integration-testing = []

[dev-dependencies]
# Enables deterministic paused-time tests for readiness deadline ordering.
tokio = { version = "1", features = ["test-util"] }
# Already in the dependency tree via webauthn-rs-core; used by the passkey
# route-level proof to build a real ES256 software authenticator.
openssl = "0.10"
serial_test = "3"
tempfile = "3"
