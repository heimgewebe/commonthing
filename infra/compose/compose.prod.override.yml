---
services:
  api:
    # Deliberate Heimserver layout assumption: .env must exist at this absolute path.
    # This injects all variables from the host's .env into the container runtime.
    # Override via WELTGEWEBE_ENV_FILE for non-standard deployments.
    # Note: WELTGEWEBE_ENV_FILE must be set for both Compose interpolation (CLI) and env_file (Runtime).
    env_file:
      - ${WELTGEWEBE_ENV_FILE:-/opt/weltgewebe/.env}
    environment:
      POLICY_LIMITS_PATH: /app/policies/limits.yaml
      APP_BASE_URL: https://commonthing.net
      WEBAUTHN_RP_ID: commonthing.net
      WEBAUTHN_RP_ORIGIN: https://commonthing.net
      WEBAUTHN_RP_NAME: commonThing
      AUTH_PUBLIC_LOGIN: '1'
      AUTH_LOG_MAGIC_TOKEN: '0'
      AUTH_AUTO_PROVISION: '1'
      # Open Registration (Option C) requires strict rate limits
      AUTH_ALLOW_EMAILS: ""
      # Caddy reaches the API over the compose bridge network, so its peer address
      # is never loopback. Without this the per-IP limits below would bucket every
      # client under the proxy's container IP. The API refuses to start on the
      # unset combination.
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}
      AUTH_RL_IP_PER_MIN: "5"
      AUTH_RL_IP_PER_HOUR: "30"
      AUTH_RL_EMAIL_PER_MIN: "2"
      AUTH_RL_EMAIL_PER_HOUR: "10"
      WEB_UPSTREAM_HOST: commonthing.home.arpa
      WEB_UPSTREAM_URL: https://commonthing.home.arpa
    volumes:
      - type: bind
        source: ${REPO_DIR:-/opt/weltgewebe}/policies/limits.yaml
        target: /app/policies/limits.yaml
        read_only: true
  caddy:
    environment: {}
    ports: []
