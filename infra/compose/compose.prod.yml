---
services:
  api:
    image: weltgewebe-api:${API_VERSION:?API_VERSION must be set}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:?GIT_COMMIT_SHA must be set}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:?BUILD_TIMESTAMP must be set}
    restart: always
    volumes:
      - gewebe_fs_data:/data
    environment:
      API_BIND: 0.0.0.0:8080
      GEWEBE_IN_DIR: /data
      # Enable demo data seeding via env var (default: false).
      # Set GEWEBE_SEED_DEMO=true in .env for development deployments.
      GEWEBE_SEED_DEMO: ${GEWEBE_SEED_DEMO:-false}
      # Enable REAL initial data seeding (default: false). Idempotent.
      # For a real deployment set GEWEBE_SEED_REAL=true and GEWEBE_SEED_DEMO=false.
      # Also set ACCOUNT_TITLE, PUBLIC_LAT, PUBLIC_LON (required when GEWEBE_SEED_REAL=true).
      GEWEBE_SEED_REAL: ${GEWEBE_SEED_REAL:-false}
      # Required when GEWEBE_SEED_REAL=true:
      ACCOUNT_TITLE: ${ACCOUNT_TITLE:-}
      PUBLIC_LAT: ${PUBLIC_LAT:-}
      PUBLIC_LON: ${PUBLIC_LON:-}
      # Optional bootstrap fields (account is always a Garnrolle; map_state controls visibility):
      ACCOUNT_ID: ${ACCOUNT_ID:-}
      ACCOUNT_SUMMARY: ${ACCOUNT_SUMMARY:-}
      ACCOUNT_ROLE: ${ACCOUNT_ROLE:-admin}
      ACCOUNT_TAGS: ${ACCOUNT_TAGS:-real}
      ACCOUNT_EMAIL: ${ACCOUNT_EMAIL:-}
      DATABASE_URL: ${DATABASE_URL}
      WELTGEWEBE_DOMAIN_READ_SOURCE: ${WELTGEWEBE_DOMAIN_READ_SOURCE:-postgres}
      WELTGEWEBE_DOMAIN_ACCOUNT_WRITE_SOURCE: ${WELTGEWEBE_DOMAIN_ACCOUNT_WRITE_SOURCE:-postgres}
      WELTGEWEBE_DOMAIN_NODE_WRITE_SOURCE: ${WELTGEWEBE_DOMAIN_NODE_WRITE_SOURCE:-postgres}
      WELTGEWEBE_DOMAIN_EDGE_WRITE_SOURCE: ${WELTGEWEBE_DOMAIN_EDGE_WRITE_SOURCE:-postgres}
      WELTGEWEBE_PASSKEY_CREDENTIAL_SOURCE: ${WELTGEWEBE_PASSKEY_CREDENTIAL_SOURCE:-postgres}
      WELTGEWEBE_API_STARTUP_MIGRATIONS: ${WELTGEWEBE_API_STARTUP_MIGRATIONS:-verify-applied}
      RUST_LOG: ${RUST_LOG:-info}
      # Auth
      AUTH_PUBLIC_LOGIN: ${AUTH_PUBLIC_LOGIN:-0}
      APP_BASE_URL: ${APP_BASE_URL:-}
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_CONTACT: ${WEB_PUSH_VAPID_CONTACT:-}
      WEB_PUSH_ALLOWED_HOST_SUFFIXES: ${WEB_PUSH_ALLOWED_HOST_SUFFIXES:-}
      # Search remains local to the API network namespace. The provider itself
      # accepts only literal loopback and revalidates runtime/model identity.
      WELTGEWEBE_SEARCH_OLLAMA_URL: ${WELTGEWEBE_SEARCH_OLLAMA_URL:-http://127.0.0.1:11434/}
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >
          wget -qO- http://localhost:8080/health/ready >/dev/null 2>&1
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      default:
        aliases:
          - weltgewebe-api

  # Local embedding runtime. Sharing the API network namespace makes the
  # provider reachable only through literal loopback; no host or compose port
  # is published. Scoped API deploys recreate api+ollama together.
  ollama:
    image: ollama/ollama:0.12.6@sha256:352e045b937ac29d3d9550c22fb85525f60a89e064df34c26579bee5a93b3a16
    restart: always
    network_mode: service:api
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_KEEP_ALIVE: ${WELTGEWEBE_SEARCH_OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NUM_PARALLEL: ${WELTGEWEBE_SEARCH_OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${WELTGEWEBE_SEARCH_OLLAMA_MAX_LOADED_MODELS:-1}
    mem_limit: ${WELTGEWEBE_SEARCH_OLLAMA_MEMORY_LIMIT:-5g}
    cpus: ${WELTGEWEBE_SEARCH_OLLAMA_CPUS:-3.0}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Persistent bounded consumer for projection jobs created after activation.
  # It shares the API namespace to preserve the literal-loopback provider
  # contract and waits for the exact pinned model before touching PostgreSQL.
  search-worker:
    image: weltgewebe-api:${API_VERSION:?API_VERSION must be set}
    restart: always
    network_mode: service:api
    command: ["/usr/local/bin/search-worker-loop"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      GEWEBE_SEED_REAL: "false"
      GEWEBE_SEED_DEMO: "false"
      WELTGEWEBE_SEARCH_GENERATION_ID: search-gen-2e8358273aa6d41e6a59025985a99738614aba725b8f369b3a54f390f8752e5c
      WELTGEWEBE_SEARCH_BACKFILL_MAX_JOBS: ${WELTGEWEBE_SEARCH_BACKFILL_MAX_JOBS:-100}
      WELTGEWEBE_SEARCH_OLLAMA_URL: http://127.0.0.1:11434/
      WELTGEWEBE_SEARCH_PROVIDER: local:ollama
      WELTGEWEBE_SEARCH_MODEL_ID: qwen3-embedding:4b
      WELTGEWEBE_SEARCH_MODEL_REVISION: sha256:df5bd2e3c74cd8d069d21dc038f1b359fcdc9458fce1c99bd43c9eb1518ff907
      WELTGEWEBE_SEARCH_RUNTIME_IDENTITY: ollama:0.12.6@http://127.0.0.1:11434
      WELTGEWEBE_SEARCH_DIMENSION: "2560"
      WELTGEWEBE_SEARCH_WORKER_INTERVAL_SECONDS: ${WELTGEWEBE_SEARCH_WORKER_INTERVAL_SECONDS:-15}
    depends_on:
      api:
        condition: service_healthy
      ollama:
        condition: service_healthy

  db:
    image: postgres:16.15@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    restart: always
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    command:
      - -js
      - -sd
      - /data
      - -m
      - "8222"
    restart: always
    volumes:
      - nats_js:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    build:
      context: ../caddy
    restart: always
    ports:
      - "${CADDY_BIND:-127.0.0.1}:80:80"
      - "${CADDY_BIND:-127.0.0.1}:443:443"
    volumes:
      - ../caddy/Caddyfile.heim:/etc/caddy/Caddyfile:ro
      - ../../build/basemap:/srv/weltgewebe-basemap:ro
      - ../../map-style:/srv/weltgewebe-map-style:ro
      - ../../apps/web/build:/srv/weltgewebe-web:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      WELTGEWEBE_BUILD: ${WELTGEWEBE_BUILD:?WELTGEWEBE_BUILD must be set}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data_prod:
  caddy_data:
  caddy_config:
  gewebe_fs_data:
  nats_js:
  ollama_models:
