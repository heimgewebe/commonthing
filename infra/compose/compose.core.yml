---
services:
  web:
    profiles: ["dev"]
    image: node:20.19.0-alpine@sha256:8bda036ddd59ea51a23bc1a1035d3b5c614e72c01366d989f4120e8adca196d4
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        corepack enable
        if [ ! -d node_modules ] || [ -z "$(ls -A node_modules)" ]; then
          pnpm install --frozen-lockfile
        fi
        exec pnpm dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ../../apps/web:/workspace
      # generate-basemap-config.js expects repository-level style files at
      # /map-style, outside the /workspace bind that contains only apps/web.
      - ../../map-style:/map-style:ro
      - /workspace/node_modules
    ports:
      - "${DEV_BIND:-127.0.0.1}:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: development
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    profiles: ["dev"]
    image: rust:1.89.0-bookworm@sha256:948f9b08a66e7fe01b03a98ef1c7568292e07ec2e4fe90d88c07bb14563c84ff
    working_dir: /workspace
    command: ["cargo", "run", "--manifest-path", "apps/api/Cargo.toml", "--bin", "weltgewebe-api"]
    environment:
      API_BIND: ${API_BIND:-0.0.0.0:8080}
      DATABASE_URL: postgres://welt:gewebe@pgbouncer:5432/weltgewebe
      RUST_LOG: ${RUST_LOG:-info}
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-0}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-1}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_CONTACT: ${WEB_PUSH_VAPID_CONTACT:-}
      WEB_PUSH_ALLOWED_HOST_SUFFIXES: ${WEB_PUSH_ALLOWED_HOST_SUFFIXES:-}
    depends_on:
      pgbouncer:
        condition: service_started
    ports:
      - "${DEV_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - ../..:/workspace
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          curl -fsS http://localhost:8080/health/live >/dev/null ||
          curl -fsS http://localhost:8080/health/ready >/dev/null ||
          curl -fsS http://localhost:8080/version >/dev/null
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  db:
    profiles: ["dev"]
    image: postgres:16@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-welt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gewebe}
      POSTGRES_DB: ${POSTGRES_DB:-weltgewebe}
    ports:
      - "${DEV_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -q -h 127.0.0.1
          -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          psql -X -w -qAt -v ON_ERROR_STOP=1
          -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
          -c 'SELECT 1' | grep -qx '1'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  pgbouncer:
    profiles: ["dev"]
    image: edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340
    environment:
      DATABASE_URL: postgres://welt:gewebe@db:5432/weltgewebe
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 10
      AUTH_TYPE: scram-sha-256
    depends_on:
      db:
        condition: service_healthy
    # Containers use PgBouncer's actual listener 5432. The host keeps the
    # conventional development port 6432 to distinguish it from PostgreSQL.
    ports:
      - "${DEV_BIND:-127.0.0.1}:6432:5432"

  caddy:
    profiles: ["dev"]
    image: caddy:2.7@sha256:236c6a30ccb84fa412a5360ca8b586d804faba0621ea182fb45902608cd8a563
    ports:
      - "${CADDY_BIND:-127.0.0.1}:8081:8081"
    volumes:
      - ../caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ../../build/basemap:/srv/weltgewebe-basemap:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  cargo_registry:
  cargo_git:
