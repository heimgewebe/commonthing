# cargo-audit reads Cargo.lock without feature resolution, so it reports crates
# that are locked but never compiled. Every exception here must name the proof
# that it is not in the build graph; security.yml re-checks it before each audit.
#
# review-after: 2027-01-04

[advisories]
ignore = [
  # RUSTSEC-2023-0071 (rsa, Marvin timing side channel; no patched release).
  # rsa is locked only as a dependency of sqlx-mysql. The API enables sqlx's
  # postgres feature alone, so `cargo tree --locked --target all -e all -i rsa`
  # prints nothing and cargo-deny's feature-aware advisory check passes.
  "RUSTSEC-2023-0071",
  # RUSTSEC-2026-0459 (libsqlite3-sys; SQLite WAL page-size memory exposure).
  # This crate is locked via SQLx optional SQLite backend, but the API builds
  # with PostgreSQL only. The security workflow must prove absence from the
  # active build graph on every run; remove this exception if that changes.
  "RUSTSEC-2026-0459",
]
