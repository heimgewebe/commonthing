---
name: Germany Basemap Rollout

"on":
  pull_request:
    branches: [main]
    paths:
      - "apps/web/.gitignore"
      - "apps/web/package.json"
      - "apps/web/vite.config.ts"
      - "apps/web/playwright.germany.proof.config.ts"
      - "apps/web/playwright.proof.config.ts"
      - "apps/web/tests/proofs/basemap-real-germany-visual.proof.ts"
      - "apps/web/scripts/generate-basemap-config.js"
      - "apps/web/scripts/generate-basemap-config.test.mjs"
      - "apps/web/src/lib/map/basemap.ts"
      - "apps/web/src/lib/map/config/basemap.current.ts"
      - "apps/web/src/lib/map/config/basemap.current.test.ts"
      - "map-style/style-germany.json"
      - "map-style/style-germany-dark.json"
      - "scripts/basemap/build-germany-pmtiles.sh"
      - "scripts/basemap/build-hamburg-pmtiles.sh"
      - "scripts/basemap/build-schleswig-holstein-pmtiles.sh"
      - "scripts/basemap/prepare-germany-rollout.sh"
      - "scripts/basemap/activate-germany-basemap.sh"
      - "scripts/basemap/assemble-germany-release-proof.py"
      - "scripts/basemap/prove-germany-staging-caddy.py"
      - "scripts/basemap/run-measured-container.py"
      - "scripts/ci/tests/test_germany_basemap_rollout.py"
      - "scripts/ci/tests/test_germany_release_proof_assembler.py"
      - "scripts/ci/tests/test_germany_staging_caddy_proof.py"
      - "scripts/ci/tests/test_germany_measured_container.py"
      - "scripts/ci/tests/test_schleswig_holstein_basemap_builder.py"
      - ".github/workflows/germany-basemap-rollout.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/.gitignore"
      - "apps/web/package.json"
      - "apps/web/vite.config.ts"
      - "apps/web/playwright.germany.proof.config.ts"
      - "apps/web/playwright.proof.config.ts"
      - "apps/web/tests/proofs/basemap-real-germany-visual.proof.ts"
      - "apps/web/scripts/generate-basemap-config.js"
      - "apps/web/scripts/generate-basemap-config.test.mjs"
      - "apps/web/src/lib/map/basemap.ts"
      - "apps/web/src/lib/map/config/basemap.current.ts"
      - "apps/web/src/lib/map/config/basemap.current.test.ts"
      - "map-style/style-germany.json"
      - "map-style/style-germany-dark.json"
      - "scripts/basemap/build-germany-pmtiles.sh"
      - "scripts/basemap/build-hamburg-pmtiles.sh"
      - "scripts/basemap/build-schleswig-holstein-pmtiles.sh"
      - "scripts/basemap/prepare-germany-rollout.sh"
      - "scripts/basemap/activate-germany-basemap.sh"
      - "scripts/basemap/assemble-germany-release-proof.py"
      - "scripts/basemap/prove-germany-staging-caddy.py"
      - "scripts/basemap/run-measured-container.py"
      - "scripts/ci/tests/test_germany_basemap_rollout.py"
      - "scripts/ci/tests/test_germany_release_proof_assembler.py"
      - "scripts/ci/tests/test_germany_staging_caddy_proof.py"
      - "scripts/ci/tests/test_germany_measured_container.py"
      - "scripts/ci/tests/test_schleswig_holstein_basemap_builder.py"
      - ".github/workflows/germany-basemap-rollout.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  germany-basemap-contract:
    name: germany-basemap-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - name: Verify shell syntax and executable contracts
        run: |
          set -euo pipefail
          bash -n scripts/basemap/build-germany-pmtiles.sh
          bash -n scripts/basemap/build-hamburg-pmtiles.sh
          bash -n scripts/basemap/build-schleswig-holstein-pmtiles.sh
          bash -n scripts/basemap/prepare-germany-rollout.sh
          bash -n scripts/basemap/activate-germany-basemap.sh
          python3 -m py_compile scripts/basemap/assemble-germany-release-proof.py
          python3 -m py_compile scripts/basemap/prove-germany-staging-caddy.py
          python3 -m py_compile scripts/basemap/run-measured-container.py
          test -x scripts/basemap/build-germany-pmtiles.sh
          test -x scripts/basemap/build-hamburg-pmtiles.sh
          test -x scripts/basemap/build-schleswig-holstein-pmtiles.sh
          test -x scripts/basemap/prepare-germany-rollout.sh
          test -x scripts/basemap/activate-germany-basemap.sh
          test -x scripts/basemap/assemble-germany-release-proof.py
          test -x scripts/basemap/prove-germany-staging-caddy.py
          test -x scripts/basemap/run-measured-container.py

      - name: Verify static basemap rollout contracts
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_germany_basemap_rollout.py
          python3 scripts/ci/tests/test_germany_release_proof_assembler.py
          python3 scripts/ci/tests/test_germany_staging_caddy_proof.py
          python3 scripts/ci/tests/test_germany_measured_container.py
          python3 scripts/ci/tests/test_schleswig_holstein_basemap_builder.py

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # tag: v6
        with:
          version: 9.11.0

      - name: Setup Node
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # provenance: untagged (7 commits after v7.0.0)
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Verify build-time variant generator
        run: pnpm test:basemap-config
        working-directory: apps/web

      - name: Prepare generated web artifacts
        run: |
          set -euo pipefail
          pnpm run generate:client-version
          pnpm run generate:basemap-config
          pnpm exec svelte-kit sync
        working-directory: apps/web

      - name: Verify runtime style selection
        run: pnpm exec vitest run src/lib/map/config/basemap.current.test.ts
        working-directory: apps/web

      - name: Build and inspect the Germany frontend variant
        env:
          PUBLIC_BASEMAP_MODE: local-sovereign
          PUBLIC_BASEMAP_VARIANT: germany
        run: |
          set -euo pipefail
          pnpm build
          expected_source_commit="$(git -C ../.. rev-parse HEAD)"
          expected_style_sha256="$(sha256sum ../../map-style/style-germany.json | awk '{print $1}')"
          expected_style_dark_sha256="$(sha256sum ../../map-style/style-germany-dark.json | awk '{print $1}')"
          EXPECTED_SOURCE_COMMIT="${expected_source_commit}" \
            EXPECTED_STYLE_SHA256="${expected_style_sha256}" \
            EXPECTED_STYLE_DARK_SHA256="${expected_style_dark_sha256}" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          identity = json.loads(
              Path("build/_app/basemap-build.json").read_text(encoding="utf-8")
          )
          light_style = json.loads(
              Path("../../map-style/style-germany.json").read_text(encoding="utf-8")
          )
          assert (
              light_style["metadata"]["weltgewebe:darkStyleSha256"]
              == os.environ["EXPECTED_STYLE_DARK_SHA256"]
          )
          assert identity == {
              "schema_version": 1,
              "mode": "local-sovereign",
              "variant": "germany",
              "style_path": "/local-basemap/style-germany.json",
              "source_commit": os.environ["EXPECTED_SOURCE_COMMIT"],
              "style_sha256": os.environ["EXPECTED_STYLE_SHA256"],
          }
          PY
        working-directory: apps/web

      - name: Verify Germany style parses and binds the stable alias
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          style = json.loads(
              Path("map-style/style-germany.json").read_text(encoding="utf-8")
          )
          source = style["sources"]["basemap-germany"]
          assert source["type"] == "vector"
          assert source["url"] == "pmtiles://basemap-germany.pmtiles"
          assert style["metadata"]["weltgewebe:variant"] == "germany"
          PY
