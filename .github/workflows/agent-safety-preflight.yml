---
name: agent-safety-preflight

"on":
  pull_request:
    paths:
      - "scripts/agent/**"
      - "tools/py/pyproject.toml"
      - "tools/py/uv.lock"
      - "toolchain.versions.yml"
      - ".python-version"
      - "scripts/contracts-agent-check.sh"
      - "scripts/docmeta/generate_agent_readiness.py"
      - "scripts/docmeta/tests/test_generate_agent_readiness.py"
      - "scripts/docmeta/tests/test_agent_readiness_smoke_contract.py"
      - "contracts/agent/**"
      - "tests/fixtures/agent/**"
      - "docs/security/**"
      - "docs/reference/agent-*.md"
      - "docs/reference/agent-operability-fixture-matrix.md"
      - "docs/reference/agent-handoff-contract.md"
      - "docs/blueprints/blueprint-agent-safety-control-layer.md"
      - "docs/claims/registry.yml"
      - "docs/doc-freshness-registry.yml"
      - "docs/tasks/index.json"
      - "docs/tasks/board.md"
      - "docs/roadmap.md"
      - ".gitattributes"
      - "docs/_generated/agent-readiness.md"
      - "agent-policy.yaml"
      - "AGENTS.md"
      - "agent-contract.json"
      - "repo.meta.yaml"
      - ".wgx/generated-artifacts.yml"
      - "README.md"
      - "docs/policies/agent-reading-protocol.md"
      - "scripts/docmeta/agent_entrypoint_smoke.py"
      - "scripts/docmeta/tests/test_agent_entrypoint_smoke.py"
      - ".github/workflows/agent-safety-preflight.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: agent-safety-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  preflight-tests:
    name: Agent Safety Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - name: Setup Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # provenance: untagged (after v7.0.0)
        with:
          python-version-file: '.python-version'

      - name: Read uv version
        id: uv-version
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION=$(grep '^uv:' toolchain.versions.yml | cut -d '"' -f2)
          if [ -z "${UV_VERSION}" ]; then
            echo "failed to parse uv version from toolchain.versions.yml" >&2
            exit 1
          fi
          printf 'uv_version=%s\n' "${UV_VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # tag: v8.3.2
        with:
          version: ${{ steps.uv-version.outputs.uv_version }}

      - name: Sync hash-locked agent dependencies
        run: uv sync --project tools/py --locked

      - name: Validate reviewed agent dependency lock
        run: uv run --project tools/py --locked python -m scripts.agent.validate_agent_tooling_lock

      - name: Run agent unit and CLI contract tests
        run: uv run --project tools/py --locked python -m unittest discover scripts/agent/tests/ -v

      - name: Smoke-check CLI (report-only, missing task file)
        run: |
          set -euo pipefail
          set +e
          uv run --project tools/py --locked python -m scripts.agent.check_agent_preflight \
            --task-file /nonexistent/task.yaml 2>/dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            printf 'Expected exit code 2 for missing task file, got %s\n' "$rc" >&2
            exit 1
          fi

      - name: Smoke-check CLI (valid task fixture)
        run: |
          set -euo pipefail
          cat > /tmp/agent-task.yaml <<'YAML'
          task_id: AGENT-SAFE-001
          task_type: doc_change
          allowed_paths:
            - docs/security/
          validation:
            - make ci-validate
          expected_evidence:
            - docs/security/agent-write-scope-baseline.md
          YAML
          uv run --project tools/py --locked python -m scripts.agent.check_agent_preflight \
            --task-file /tmp/agent-task.yaml \
            --changed-paths docs/security/agent-write-scope-baseline.md \
            --mode report-only

      - name: Smoke-check handoff validator (valid fixture)
        run: |
          set -euo pipefail
          uv run --project tools/py --locked python -m scripts.agent.validate_handoff \
            --task-file tests/fixtures/agent/handoff-task.json \
            --handoff-file tests/fixtures/agent/handoff-valid.json

      - name: Smoke-check dry-run runner (evidence, no repository write)
        run: |
          set -euo pipefail

          repository_state() {
            uv run --project tools/py --locked python - <<'PY'
          from pathlib import Path

          from scripts.agent.run_task import repository_state_bytes

          print(repository_state_bytes(Path.cwd()).hex())
          PY
          }

          BEFORE="$(repository_state)"
          OUT="$(mktemp -d)"
          trap 'rm -rf -- "$OUT"' EXIT

          uv run --project tools/py --locked python -m scripts.agent.run_task \
            --dry-run \
            --output-dir "$OUT/doc-drift" \
            tests/fixtures/agent/valid-doc-drift-task.json

          uv run --project tools/py --locked python -m scripts.agent.run_task \
            --dry-run \
            --output-dir "$OUT/roadmap" \
            tests/fixtures/agent/valid-roadmap-claim-task.json

          uv run --project tools/py --locked python -m scripts.agent.run_task \
            --dry-run \
            --output-dir "$OUT/generated-refresh" \
            tests/fixtures/agent/valid-generated-refresh-task.json

          for run_dir in "$OUT/doc-drift" "$OUT/roadmap" "$OUT/generated-refresh"; do
            for artifact in task.yml handoff.json validation.json run-result.json; do
              test -f "$run_dir/$artifact"
            done
          done

          AFTER="$(repository_state)"
          if [ "$BEFORE" != "$AFTER" ]; then
            printf 'Dry-run runner changed Git-visible repository content\n' >&2
            git status --short --untracked-files=all >&2
            exit 1
          fi

      - name: Run agent readiness tests
        run: |
          uv run --project tools/py --locked python -m unittest \
            scripts.docmeta.tests.test_generate_agent_readiness \
            scripts.docmeta.tests.test_agent_readiness_smoke_contract \
            -v

      - name: Run agent entrypoint smoke tests
        run: |
          uv run --project tools/py --locked python -m scripts.docmeta.agent_entrypoint_smoke
          uv run --project tools/py --locked python -m unittest scripts.docmeta.tests.test_agent_entrypoint_smoke -v

      - name: Validate agent contracts (Python)
        run: |
          uv run --project tools/py --locked python -m scripts.agent.validate_agent_contracts
          uv run --project tools/py --locked python -m scripts.agent.validate_repo_agent_contract

      - name: Check handoff fixture digest is fresh
        run: uv run --project tools/py --locked python -m scripts.agent.update_handoff_fixtures --check
