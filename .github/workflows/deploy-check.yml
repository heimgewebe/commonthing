---
name: Deploy Check
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

"on":
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'infra/caddy/**'
      - 'scripts/preflight/**'
      - '.github/workflows/deploy-check.yml'
      - '.node-version'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'infra/caddy/**'
      - 'scripts/preflight/**'
      - '.github/workflows/deploy-check.yml'
      - '.node-version'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  csp-contract-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # tag: v6

      - name: Setup Node
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # provenance: untagged (7 commits after v7.0.0)
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web App
        run: pnpm build

      - name: Run CSP contract guard
        working-directory: .
        run: |
          ROOT=$GITHUB_WORKSPACE \
          CADDYFILE_PATH=infra/caddy/Caddyfile.heim \
          CADDY_TARGET_SITE=weltgewebe.home.arpa \
          scripts/preflight/csp_contract_static.sh
