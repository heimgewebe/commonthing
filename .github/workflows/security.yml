---
name: security

"on":
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "toolchain.versions.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "apps/api/Dockerfile"
      - "apps/api/entrypoint.sh"
      - "policies/**"
      - "scripts/dev/generate-demo-data.sh"
      - "scripts/dev/bootstrap-first-account.sh"
      - "scripts/ops/search-worker-loop.sh"
      - "deny.toml"
      - ".github/workflows/security.yml"
    types: [opened, synchronize, labeled]
  schedule:
    - cron: "45 2 * * *"   # nightly audit (02:45 UTC ≈ 04:45 Berlin)
    - cron: "10 3 * * 0"   # weekly deny (03:10 UTC ≈ 05:10 Berlin)
    - cron: "25 3 * * 0"   # weekly SBOM + image scan (03:25 UTC ≈ 05:25 Berlin)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit (nightly + on-demand)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'security')) ||
      (github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f toolchain.versions.yml ]; then
            echo "toolchain.versions.yml not found" >&2
            exit 1
          fi
          SED_EXPR="s/^[[:space:]]*rust:[[:space:]]*['\"]?([^'\"#[:space:]]+)['\"]?[[:space:]]*(#.*)?$/\1/p"
          RUST_VERSION="$(sed -nE "${SED_EXPR}" toolchain.versions.yml | head -n1 | xargs)"
          if [ -z "${RUST_VERSION}" ]; then
            echo "failed to parse rust version from toolchain.versions.yml" >&2
            exit 1
          fi
          printf 'rust_version=%s\n' "${RUST_VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust_version }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # tag: v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --force
      - name: Run cargo audit (JSON report)
        run: cargo audit --json | tee cargo-audit-report.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: cargo-audit-report
          path: cargo-audit-report.json
          retention-days: 14

  deny:
    name: cargo-deny (weekly + on-demand)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'security')) ||
      (github.event_name == 'schedule' && github.event.schedule == '10 3 * * 0')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f toolchain.versions.yml ]; then
            echo "toolchain.versions.yml not found" >&2
            exit 1
          fi
          SED_EXPR="s/^[[:space:]]*rust:[[:space:]]*['\"]?([^'\"#[:space:]]+)['\"]?[[:space:]]*(#.*)?$/\1/p"
          RUST_VERSION="$(sed -nE "${SED_EXPR}" toolchain.versions.yml | head -n1 | xargs)"
          if [ -z "${RUST_VERSION}" ]; then
            echo "failed to parse rust version from toolchain.versions.yml" >&2
            exit 1
          fi
          printf 'rust_version=%s\n' "${RUST_VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust_version }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # tag: v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --force
      - name: Run cargo deny (JSON report)
        run: cargo deny --format json check | tee cargo-deny-report.json
      - name: Upload cargo-deny report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: cargo-deny-report
          path: cargo-deny-report.json
          retention-days: 14

  sbom:
    name: syft sbom (weekly + on-demand)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'security')) ||
      (github.event_name == 'schedule' && github.event.schedule == '25 3 * * 0')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@04151451f829cb881fd7b3250eccf4021433e14e # tag: v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 21

  image-scan:
    name: trivy API image (weekly + relevant PRs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'schedule' && github.event.schedule == '25 3 * * 0')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
      - name: Derive reproducible image metadata
        id: image-metadata
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TIMESTAMP="$(git show -s --format=%cI "${GITHUB_SHA}")"
          printf 'build_timestamp=%s\n' "${BUILD_TIMESTAMP}" >> "${GITHUB_OUTPUT}"
      - name: Build production API image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file apps/api/Dockerfile \
            --tag weltgewebe-api:trivy-scan \
            --build-arg "GIT_COMMIT_SHA=${GITHUB_SHA}" \
            --build-arg "BUILD_TIMESTAMP=${{ steps.image-metadata.outputs.build_timestamp }}" \
            .
      - name: Scan production API image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # tag: v0.36.0
        with:
          scan-type: image
          image-ref: weltgewebe-api:trivy-scan
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-image-report.json
          exit-code: "1"
      # The scan writes JSON only, so its findings reach neither the log nor the
      # summary. Render them into both: the summary for people, the log for
      # anyone reading job logs through the API, where summaries are not served.
      - name: Render Trivy findings into job summary and log
        if: always()
        shell: bash
        env:
          TRIVY_REPORT: trivy-image-report.json
        run: |
          set -euo pipefail
          rendered="$(mktemp)"
          runtime_base="$(awk '$1 == "FROM" { for (i = 2; i <= NF; i++) if ($i !~ /^--/) { ref = $i; break } }
            END { print ref }' apps/api/Dockerfile)"
          # os-pkgs only says "OS package", not which layer brought it. A finding
          # counts as base image only if Trivy attributes it to a layer of the
          # pinned runtime base; packages installed after the last FROM do not.
          base_layers=null
          if [[ -n "${runtime_base}" ]] && docker pull --quiet "${runtime_base}" > /dev/null 2>&1; then
            base_layers="$(docker image inspect --format '{{json .RootFS.Layers}}' "${runtime_base}" 2> /dev/null \
              || echo null)"
          fi
          if [[ ! -s "${TRIVY_REPORT}" ]]; then
            {
              printf '## Trivy API image: kein Report\n\n'
              printf 'Der Scan hat keinen Report geschrieben; die Ursache steht im fehlgeschlagenen Step davor.\n'
            } > "${rendered}"
          else
            total="$(jq '[.Results[]?.Vulnerabilities[]?] | length' "${TRIVY_REPORT}")"
            {
              printf '## Trivy API image: %s behebbare HIGH/CRITICAL-Treffer\n\n' "${total}"
              printf 'Laufzeitbasis laut `apps/api/Dockerfile`: `%s`\n\n' "${runtime_base:-?}"
              jq -r '"Im Image erkannt: \(.Metadata.OS.Family // "?") \(.Metadata.OS.Name // "?")\n"' "${TRIVY_REPORT}"
              if (( total == 0 )); then
                printf 'Keine Treffer oberhalb der Schwelle.\n'
              else
                printf '| Quelle | Paket | Installiert | Behoben in | Schwere | CVE |\n'
                printf '| --- | --- | --- | --- | --- | --- |\n'
                jq -r --argjson base "${base_layers}" '
                  [ .Results[]?
                    | .Class as $class
                    | (.Type // "?") as $type
                    | .Vulnerabilities[]?
                    | (.Layer.DiffID // "") as $diff
                    | ( if $class != "os-pkgs" then "Abhängigkeit"
                        elif $base == null or $diff == "" then "OS-Paket, Schicht unbekannt"
                        elif any($base[]; . == $diff) then "Basisimage"
                        else "Dockerfile-Schicht" end ) as $origin
                    | . + {Source: "\($origin) (\($type))"} ]
                  | sort_by(if .Severity == "CRITICAL" then 0 else 1 end, .Source, .PkgName, .VulnerabilityID)
                  | .[0:100][]
                  | [ .Source, .PkgName, .InstalledVersion, (.FixedVersion // "-"), .Severity ]
                    as $cells
                  | ($cells | map(tostring | gsub("\\|"; "\\|")))
                    + [ "[\(.VulnerabilityID)](\(.PrimaryURL
                          // ("https://nvd.nist.gov/vuln/detail/" + .VulnerabilityID)))" ]
                  | "| " + join(" | ") + " |"
                ' "${TRIVY_REPORT}"
                if (( total > 100 )); then
                  printf '\n_Gekürzt auf 100 Zeilen; der vollständige Report liegt im Artefakt %s._\n' \
                    '`trivy-api-image-report`'
                fi
                printf '\n_Basisimage_: Schicht des gepinnten Basisimages; ein neuerer Basis-Digest kann helfen.\n'
                printf '_Dockerfile-Schicht_: nach dem letzten `FROM` installiert oder aktualisiert; '
                printf 'die Version bestimmt der `apt-get`-Schritt, nicht der Basis-Digest.\n'
                printf '_OS-Paket, Schicht unbekannt_: Basisschichten nicht ermittelbar; Herkunft offen.\n'
                printf '_Abhängigkeit_: braucht ein Update in `Cargo.lock`; ein Digest-Bump ändert daran nichts.\n'
              fi
            } > "${rendered}"
            if (( total > 0 )); then
              printf '::error title=Trivy API image::%s behebbare HIGH/CRITICAL-Treffer, %s\n' \
                "${total}" "Tabelle im Job-Summary und im Log von \"Render Trivy findings\""
            fi
          fi
          cat "${rendered}" >> "${GITHUB_STEP_SUMMARY}"
          cat "${rendered}"
      - name: Upload Trivy image report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: trivy-api-image-report
          path: trivy-image-report.json
          retention-days: 21
