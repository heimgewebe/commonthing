---
name: Governance Full Flow Proof

"on":
  pull_request:
    branches: [main]
    paths:
      - "apps/api/src/governance.rs"
      - "apps/api/src/routes/auth.rs"
      - "apps/api/src/routes/governance.rs"
      - "apps/api/src/routes/mod.rs"
      - "apps/api/tests/auth_security_invariants.rs"
      - "apps/web/package.json"
      - "apps/web/vite.config.ts"
      - "apps/web/pnpm-lock.yaml"
      - "apps/web/playwright.governance.proof.config.ts"
      - "apps/web/tests/proofs/governance-full-flow.proof.ts"
      - "docs/specs/governance-antraege.md"
      - ".github/workflows/governance-full-flow-proof.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "toolchain.versions.yml"
      - ".node-version"
  push:
    branches: [main]
    paths:
      - "apps/api/src/governance.rs"
      - "apps/api/src/routes/auth.rs"
      - "apps/api/src/routes/governance.rs"
      - "apps/api/src/routes/mod.rs"
      - "apps/api/tests/auth_security_invariants.rs"
      - "apps/web/package.json"
      - "apps/web/vite.config.ts"
      - "apps/web/pnpm-lock.yaml"
      - "apps/web/playwright.governance.proof.config.ts"
      - "apps/web/tests/proofs/governance-full-flow.proof.ts"
      - "docs/specs/governance-antraege.md"
      - ".github/workflows/governance-full-flow-proof.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "toolchain.versions.yml"
      - ".node-version"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-full-flow-proof:
    name: governance PostgreSQL browser proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weltgewebe_governance_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d weltgewebe_governance_proof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CARGO_TERM_COLOR: always
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PLAYWRIGHT_HTML_REPORT_OPEN: never
      PLAYWRIGHT_HTML_REPORT: playwright-report-governance
      GOVERNANCE_PROOF_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/weltgewebe_governance_proof

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          set -euo pipefail
          SED_EXPR="s/^[[:space:]]*rust:[[:space:]]*['\"]?([^'\"#[:space:]]+)['\"]?[[:space:]]*(#.*)?$/\1/p"
          RUST_VERSION="$(sed -nE "${SED_EXPR}" toolchain.versions.yml | head -n1 | xargs)"
          test -n "${RUST_VERSION}"
          printf 'rust_version=%s\n' "${RUST_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust_version }}
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # tag: v2

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # tag: v6
        with:
          version: 9.11.0

      - name: Setup Node
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # provenance: untagged (after v7.0.0)
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Check Rust format
        run: cargo fmt --all -- --check

      - name: Pre-build API proof binary
        run: cargo build --locked --features integration-testing
        working-directory: apps/api

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ""
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - name: Start pinned JetStream for readiness-backed proof
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$(
            python3 - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(
              Path("scripts/ci/postgres-proof-contract.json").read_text(encoding="utf-8")
          )
          print(contract["jetstream_image"])
          PY
          )"
          CONTAINER="weltgewebe-governance-nats-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'GOVERNANCE_NATS_CONTAINER=%s\n' "${CONTAINER}" >> "${GITHUB_ENV}"
          docker run --detach --rm \
            --name "${CONTAINER}" \
            --publish 127.0.0.1::4222 \
            "${IMAGE}" -js > /dev/null
          BINDING="$(docker port "${CONTAINER}" 4222/tcp)"
          PORT="${BINDING##*:}"
          if [[ ! "${PORT}" =~ ^[0-9]+$ ]]; then
            echo "could not resolve JetStream port from ${BINDING}" >&2
            exit 1
          fi
          python3 - "${PORT}" <<'PY'
          import socket
          import sys
          import time

          port = int(sys.argv[1])
          deadline = time.monotonic() + 20
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", port), timeout=1):
                      break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit("JetStream proof port did not become reachable")
          PY
          printf 'NATS_URL=nats://127.0.0.1:%s\n' "${PORT}" >> "${GITHUB_ENV}"

      - name: Run governance full-flow proof
        run: pnpm test:proof:governance-full-flow
        working-directory: apps/web

      - name: Stop JetStream proof container
        if: always()
        shell: bash
        run: |
          if [[ -n "${GOVERNANCE_NATS_CONTAINER:-}" ]]; then
            docker rm --force "${GOVERNANCE_NATS_CONTAINER}" > /dev/null 2>&1 || true
          fi

      - name: Upload proof summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: governance-full-flow-proof-summary
          path: build/proofs/governance-full-flow/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: governance-full-flow-proof-report
          path: apps/web/playwright-report-governance/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: governance-full-flow-proof-traces
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14
