---
name: Review Evidence Gate

"on":
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to re-evaluate
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GH_API_VERSION: "2022-11-28"
  # Stable branch-protection context. Keep distinct from the cancellable workflow
  # job name `Review evidence evaluator`; otherwise a CANCELLED check-run can
  # block a later exact-head terminal commit status with the same required name.
  REVIEW_EVIDENCE_CONTEXT: "Review evidence gate"

jobs:
  review-evidence:
    # Keep the workflow check-run name distinct from the required commit-status context.
    # A cancelled concurrency run must never shadow a later exact-head terminal status.
    name: Review evidence evaluator
    if: >-
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.pull_request != null &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
          (
            contains(github.event.comment.body, '<!-- weltgewebe-review-evidence') ||
            contains(github.event.comment.body, '<!-- weltgewebe-forwarded-review') ||
            (
              github.event.action == 'edited' &&
              (
                contains(github.event.changes.body.from, '<!-- weltgewebe-review-evidence') ||
                contains(github.event.changes.body.from, '<!-- weltgewebe-forwarded-review')
              )
            ) ||
            startsWith(github.event.comment.body, '/review-evidence recheck')
          )
        )
      ) &&
      (
        github.event_name != 'pull_request_target' ||
        github.event.pull_request.user.login != 'dependabot[bot]'
      ) &&
      (
        github.event_name != 'pull_request_review' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        )
      )
    # Job-level concurrency is intentional: events rejected by `if` never enter
    # this group and therefore cannot replace either running or pending evaluators.
    concurrency:
      group: review-evidence-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Security boundary: this workflow has a token that may write commit status.
      # It executes only code from literal `main`. Pull-request content is downloaded
      # through the GitHub API as inert diff/patch/JSON data; no PR Git object is fetched,
      # checked out, imported or executed.
      - name: Checkout trusted governance implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve PR and evaluate exact review evidence
        id: evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          output_dir="${RUNNER_TEMP}/weltgewebe-review-evidence"
          mkdir -p "${output_dir}"

          write_internal_failure() {
            local message="$1"
            jq -n --arg message "${message}" '{
              schema_version: 1,
              kind: "weltgewebe-review-evaluation",
              pass: false,
              reasons: [$message]
            }' > "${output_dir}/evaluation.json"
          }

          on_error() {
            local rc=$?
            write_internal_failure \
              "trusted workflow preparation failed with exit code ${rc}"
            exit "${rc}"
          }
          trap on_error ERR

          case "${EVENT_NAME}" in
            pull_request_target|pull_request_review)
              pr_number="$(jq -r '.pull_request.number' "${EVENT_PATH}")"
              ;;
            issue_comment)
              pr_number="$(jq -r '.issue.number' "${EVENT_PATH}")"
              ;;
            workflow_dispatch)
              pr_number="${DISPATCH_PR_NUMBER}"
              ;;
            *)
              write_internal_failure "unsupported event: ${EVENT_NAME}"
              exit 2
              ;;
          esac
          [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]]

          api_header="X-GitHub-Api-Version: ${GH_API_VERSION}"
          pr_api="repos/${REPOSITORY}/pulls/${pr_number}"
          gh api -H "${api_header}" "${pr_api}" > "${RUNNER_TEMP}/pr-before.json"
          state="$(jq -r '.state' "${RUNNER_TEMP}/pr-before.json")"
          base_ref="$(jq -r '.base.ref' "${RUNNER_TEMP}/pr-before.json")"
          base_sha="$(jq -r '.base.sha' "${RUNNER_TEMP}/pr-before.json")"
          head_sha="$(jq -r '.head.sha' "${RUNNER_TEMP}/pr-before.json")"
          [[ "${state}" == "open" ]]
          [[ "${base_ref}" == "main" ]]
          [[ "${base_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]]

          {
            echo "pr_number=${pr_number}"
            echo "base_sha=${base_sha}"
            echo "head_sha=${head_sha}"
            echo "output_dir=${output_dir}"
          } >> "${GITHUB_OUTPUT}"

          gh api --method POST -H "${api_header}" \
            "repos/${REPOSITORY}/statuses/${head_sha}" \
            -f state=pending \
            -f context="${REVIEW_EVIDENCE_CONTEXT}" \
            -f description='Exact diff and review evidence are being verified.' \
            -f target_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null

          gh api -H "${api_header}" -H 'Accept: application/vnd.github.diff' \
            "${pr_api}" > "${RUNNER_TEMP}/pr.diff"
          gh api -H "${api_header}" -H 'Accept: application/vnd.github.patch' \
            "${pr_api}" > "${RUNNER_TEMP}/pr.patch"
          max_artifact_bytes=$((100 * 1024 * 1024))
          diff_bytes="$(wc -c < "${RUNNER_TEMP}/pr.diff")"
          patch_bytes="$(wc -c < "${RUNNER_TEMP}/pr.patch")"
          (( diff_bytes > 0 && diff_bytes <= max_artifact_bytes ))
          (( patch_bytes > 0 && patch_bytes <= max_artifact_bytes ))
          gh api -H "${api_header}" \
            "repos/${REPOSITORY}/compare/${base_sha}...${head_sha}" \
            > "${RUNNER_TEMP}/compare.json"
          gh api --paginate --slurp -H "${api_header}" \
            "${pr_api}/files?per_page=100" \
            > "${RUNNER_TEMP}/file-pages.json"
          jq -e 'type == "array" and all(.[]; type == "array")' \
            "${RUNNER_TEMP}/file-pages.json" >/dev/null
          jq '[.[][]]' "${RUNNER_TEMP}/file-pages.json" \
            > "${RUNNER_TEMP}/files.json"

          expected_files="$(jq -r '.changed_files' "${RUNNER_TEMP}/pr-before.json")"
          actual_files="$(jq -r 'length' "${RUNNER_TEMP}/files.json")"
          diff_file_count="$(grep -c '^diff --git ' "${RUNNER_TEMP}/pr.diff" || true)"
          [[ "${actual_files}" == "${expected_files}" ]]
          [[ "${diff_file_count}" == "${expected_files}" ]]
          jq -e 'all(.[]; (.filename | type == "string") and (.filename | length > 0))' \
            "${RUNNER_TEMP}/files.json" >/dev/null
          jq -e '
            all(.[];
              if .status == "renamed" then
                ((.previous_filename | type) == "string") and
                ((.previous_filename | length) > 0)
              else
                true
              end
            )
          ' "${RUNNER_TEMP}/files.json" >/dev/null

          gh api -H "${api_header}" "${pr_api}" > "${RUNNER_TEMP}/pr-after.json"
          jq -e --arg base "${base_sha}" --arg head "${head_sha}" '
            .state == "open" and
            .base.ref == "main" and
            .base.sha == $base and
            .head.sha == $head
          ' "${RUNNER_TEMP}/pr-after.json" >/dev/null

          jq -n \
            --slurpfile pr "${RUNNER_TEMP}/pr-before.json" \
            --slurpfile compare "${RUNNER_TEMP}/compare.json" \
            --slurpfile files "${RUNNER_TEMP}/files.json" '
            {
              schema_version: 1,
              pr_number: $pr[0].number,
              base_sha: $pr[0].base.sha,
              head_sha: $pr[0].head.sha,
              merge_base_sha: $compare[0].merge_base_commit.sha,
              changed_file_count: ($files[0] | length),
              changed_files: [$files[0][].filename],
              attention_changed_files: ([
                $files[0][] |
                .filename,
                (select(.status == "renamed") | .previous_filename)
              ] | map(select(type == "string" and length > 0)) | unique),
              additions: $pr[0].additions,
              deletions: $pr[0].deletions,
              opaque_files: [
                $files[0][] |
                select((has("patch") | not) or .patch == null) |
                .filename
              ]
            }
          ' > "${RUNNER_TEMP}/metadata.json"

          jq -r '.body // ""' "${RUNNER_TEMP}/pr-before.json" \
            > "${RUNNER_TEMP}/pr-body.md"
          gh api --paginate --slurp -H "${api_header}" \
            "repos/${REPOSITORY}/issues/${pr_number}/comments?per_page=100" \
            > "${RUNNER_TEMP}/comments.json"
          gh api --paginate --slurp -H "${api_header}" \
            "${pr_api}/reviews?per_page=100" \
            > "${RUNNER_TEMP}/reviews.json"

          trap - ERR
          python3 scripts/quality/review_governance.py evaluate-materialized \
            --output-dir "${output_dir}" \
            --metadata-file "${RUNNER_TEMP}/metadata.json" \
            --diff-file "${RUNNER_TEMP}/pr.diff" \
            --patch-file "${RUNNER_TEMP}/pr.patch" \
            --pr-body-file "${RUNNER_TEMP}/pr-body.md" \
            --comments-file "${RUNNER_TEMP}/comments.json" \
            --reviews-file "${RUNNER_TEMP}/reviews.json" \
            --authorities-file .github/review-evidence-authorities.json

      - name: Refresh current-head evidence before publication
        id: refresh
        if: ${{ always() && steps.evaluate.outputs.head_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.evaluate.outputs.pr_number }}
          BASE_SHA: ${{ steps.evaluate.outputs.base_sha }}
          HEAD_SHA: ${{ steps.evaluate.outputs.head_sha }}
          OUTPUT_DIR: ${{ steps.evaluate.outputs.output_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          api_header="X-GitHub-Api-Version: ${GH_API_VERSION}"
          pr_api="repos/${REPOSITORY}/pulls/${PR_NUMBER}"

          write_refresh_failure() {
            local message="$1"
            jq -n --arg message "${message}" '{
              schema_version: 1,
              kind: "weltgewebe-review-evaluation",
              pass: false,
              reasons: [$message]
            }' > "${OUTPUT_DIR}/evaluation.json"
          }

          on_error() {
            local rc=$?
            trap - ERR
            write_refresh_failure "final evidence refresh failed with exit code ${rc}"
            exit "${rc}"
          }
          trap on_error ERR

          gh api -H "${api_header}" "${pr_api}" > "${RUNNER_TEMP}/pr-final.json"
          jq -e --arg base "${BASE_SHA}" --arg head "${HEAD_SHA}" '
            .state == "open" and
            .base.ref == "main" and
            .base.sha == $base and
            .head.sha == $head
          ' "${RUNNER_TEMP}/pr-final.json" >/dev/null
          jq -r '.body // ""' "${RUNNER_TEMP}/pr-final.json" > \
            "${RUNNER_TEMP}/pr-body-final.md"
          gh api --paginate --slurp -H "${api_header}" \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            > "${RUNNER_TEMP}/comments-final.json"
          gh api --paginate --slurp -H "${api_header}" \
            "${pr_api}/reviews?per_page=100" \
            > "${RUNNER_TEMP}/reviews-final.json"

          trap - ERR
          set +e
          python3 scripts/quality/review_governance.py evaluate-materialized \
            --output-dir "${OUTPUT_DIR}" \
            --metadata-file "${RUNNER_TEMP}/metadata.json" \
            --diff-file "${RUNNER_TEMP}/pr.diff" \
            --patch-file "${RUNNER_TEMP}/pr.patch" \
            --pr-body-file "${RUNNER_TEMP}/pr-body-final.md" \
            --comments-file "${RUNNER_TEMP}/comments-final.json" \
            --reviews-file "${RUNNER_TEMP}/reviews-final.json" \
            --authorities-file .github/review-evidence-authorities.json
          evaluation_rc=$?
          set -e
          exit "${evaluation_rc}"

      - name: Upload downloadable diff and review bundle
        if: ${{ always() && steps.evaluate.outputs.pr_number != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: wg-review-pr-${{ steps.evaluate.outputs.pr_number }}-${{ steps.evaluate.outputs.head_sha }}
          path: ${{ steps.evaluate.outputs.output_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact-head gate status
        if: ${{ always() && steps.evaluate.outputs.head_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.evaluate.outputs.head_sha }}
          OUTPUT_DIR: ${{ steps.evaluate.outputs.output_dir }}
        shell: bash
        run: |
          set -euo pipefail
          evaluation="${OUTPUT_DIR}/evaluation.json"
          if [[ -f "${evaluation}" ]] && \
             [[ "$(jq -r '.pass // false' "${evaluation}")" == "true" ]]; then
            state=success
            description='Exact diff and required review evidence are verified.'
          else
            state=failure
            description='Review evidence is missing, stale, malformed or blocking.'
          fi

          published=false
          for attempt in 1 2 3; do
            if gh api --method POST \
              -H "X-GitHub-Api-Version: ${GH_API_VERSION}" \
              "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state="${state}" \
              -f context="${REVIEW_EVIDENCE_CONTEXT}" \
              -f description="${description}" \
              -f target_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              >/dev/null; then
              published=true
              break
            fi
            sleep "${attempt}"
          done
          test "${published}" = true

      - name: Enforce review evidence result
        if: ${{ always() }}
        env:
          OUTPUT_DIR: ${{ steps.evaluate.outputs.output_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OUTPUT_DIR:-}"
          test -f "${OUTPUT_DIR}/evaluation.json"
          test "$(jq -r '.pass // false' "${OUTPUT_DIR}/evaluation.json")" = "true"
