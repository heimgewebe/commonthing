---
name: api

"on":
  pull_request:
    branches: [main]
    paths:
      - "toolchain.versions.yml"
      - "apps/api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "configs/app.defaults.yml"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "toolchain.versions.yml"
      - "apps/api/**"
      - "configs/app.defaults.yml"
      - ".github/workflows/api.yml"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: test and lint (rust)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always  # keep cargo output colorized in CI logs
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      # Optional: Validates that a default app config is parseable (if present)
      - name: Install PyYAML for config validation
        if: hashFiles('configs/app.defaults.yml') != ''
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir pyyaml

      - name: Validate app.defaults.yml (optional)
        if: hashFiles('configs/app.defaults.yml') != ''
        run: |
          python3 - <<'PY'
          import yaml
          from pathlib import Path

          p = Path("configs/app.defaults.yml")
          yaml.safe_load(p.read_text(encoding="utf-8"))
          print("configs/app.defaults.yml: OK")
          PY

      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f toolchain.versions.yml ]; then
            echo "toolchain.versions.yml not found" >&2
            exit 1
          fi
          SED_EXPR="s/^[[:space:]]*rust:[[:space:]]*['\"]?([^'\"#[:space:]]+)['\"]?[[:space:]]*(#.*)?$/\1/p"
          RUST_VERSION="$(sed -nE "${SED_EXPR}" toolchain.versions.yml | head -n1 | xargs)"
          if [ -z "${RUST_VERSION}" ]; then
            echo "failed to parse rust version from toolchain.versions.yml" >&2
            exit 1
          fi
          printf 'rust_version=%s\n' "${RUST_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust_version }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # tag: v2

      # fmt & clippy at repo root: covers all crates/workspaces
      - name: Format check (workspace)
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings, workspace)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all features, verbose)
        working-directory: apps/api
        run: cargo test --all-features --verbose

  msrv-check:
    name: MSRV check (rust-version)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - name: Read declared rust-version
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          pattern='s/^rust-version[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p'
          MSRV="$(sed -nE "${pattern}" apps/api/Cargo.toml)"
          if [ -z "${MSRV}" ]; then
            echo "apps/api/Cargo.toml must declare rust-version as X.Y.Z" >&2
            exit 1
          fi
          printf 'msrv=%s\n' "${MSRV}" >> "${GITHUB_OUTPUT}"

      - name: Install declared minimum toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # tag: v2
        with:
          key: msrv-${{ steps.msrv.outputs.msrv }}

      - name: Build every target and feature with the declared minimum
        run: cargo +${{ steps.msrv.outputs.msrv }} check --locked -p weltgewebe-api --all-targets --all-features

  cookie-session-proof:
    name: cookie session proof (phase 6)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f toolchain.versions.yml ]; then
            echo "toolchain.versions.yml not found" >&2
            exit 1
          fi
          SED_EXPR="s/^[[:space:]]*rust:[[:space:]]*['\"]?([^'\"#[:space:]]+)['\"]?[[:space:]]*(#.*)?$/\1/p"
          RUST_VERSION="$(sed -nE "${SED_EXPR}" toolchain.versions.yml | head -n1 | xargs)"
          if [ -z "${RUST_VERSION}" ]; then
            echo "failed to parse rust version from toolchain.versions.yml" >&2
            exit 1
          fi
          printf 'rust_version=%s\n' "${RUST_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust_version }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # tag: v2

      - name: Run phase 6 cookie/session proof tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p weltgewebe-api \
            --test api_auth session_cookie_ \
            -- --test-threads=1 --color never | tee /tmp/cookie-session-proof.log

          if grep -Eq "running 0 tests|0 passed; 0 failed" /tmp/cookie-session-proof.log; then
            echo "ERROR: cookie/session proof matched zero tests" >&2
            exit 1
          fi

          grep -Eq "running [1-9][0-9]* tests" /tmp/cookie-session-proof.log
          grep -Eq "test result: ok\." /tmp/cookie-session-proof.log
          echo "PROVEN: cookie/session proof tests passed (phase 6)"

  db-session-persistence-proof:
    name: db session persistence proof (direct postgres)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      DATABASE_URL: postgres://welt:gewebe@localhost:5432/weltgewebe_ci_proof
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: welt
          POSTGRES_PASSWORD: gewebe
          POSTGRES_DB: weltgewebe_ci_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

