            echo "failed to parse rust version from toolchain.versions.yml" >&2
            exit 1
          fi
          printf 'rust_version=%s\n' "${RUST_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust_version }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # tag: v2

      - name: Wait for PostgreSQL
        run: |
          max_attempts=15
          for attempt in $(seq 1 "$max_attempts"); do
            if pg_isready -h localhost -p 5432 -U welt -d weltgewebe_ci_proof; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            echo "Waiting for postgres... attempt ${attempt}/${max_attempts}"
            sleep 2
          done
          echo "ERROR: PostgreSQL did not become ready after ${max_attempts} attempts." >&2
          exit 1

      - name: Run domain node write path proof (direct PostgreSQL, --include-ignored)
        run: |
          DATABASE_URL="postgres://${PGUSER}:${PGPASSWORD}@localhost:5432/${PGDATABASE}" \
            AUTH_GUEST_EXIT_STEP_UP_ENABLED=1 \
            cargo test --locked -p weltgewebe-api \
              --test db_domain_node_write_path \
              -- --include-ignored --test-threads=1

      - name: Run node conversation proof (direct PostgreSQL, --include-ignored)
        run: |
          DATABASE_URL="postgres://${PGUSER}:${PGPASSWORD}@localhost:5432/${PGDATABASE}" \
            cargo test --locked -p weltgewebe-api \
              --test db_node_conversations \
              -- --include-ignored --test-threads=1

      - name: Run governance conversation target proof (direct PostgreSQL, --include-ignored)
        run: |
          DATABASE_URL="postgres://${PGUSER}:${PGPASSWORD}@localhost:5432/${PGDATABASE}" \
            cargo test --locked -p weltgewebe-api \
              --test db_governance_conversation_target \
              -- --include-ignored --test-threads=1

