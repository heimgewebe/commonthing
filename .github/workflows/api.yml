      - name: Wait for PostgreSQL
        run: |
          max_attempts=15
          for attempt in $(seq 1 "$max_attempts"); do
            if pg_isready -h localhost -p 5432 -U welt -d weltgewebe_ci_proof; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            echo "Waiting for postgres... attempt ${attempt}/${max_attempts}"
            sleep 2
          done
          echo "ERROR: PostgreSQL did not become ready after ${max_attempts} attempts." >&2
          exit 1

      - name: Run domain edge write path proof (direct PostgreSQL, --include-ignored)
        run: |
          DATABASE_URL="postgres://${PGUSER}:${PGPASSWORD}@localhost:5432/${PGDATABASE}" \
            cargo test --locked -p weltgewebe-api \
              --test db_domain_edge_write_path \
              -- --include-ignored --test-threads=1

  magic-link-flow-proof:
    name: magic link flow proof (request to session)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f toolchain.versions.yml ]; then
            echo "toolchain.versions.yml not found" >&2
            exit 1
          fi
          SED_EXPR="s/^[[:space:]]*rust:[[:space:]]*['\"]?([^'\"#[:space:]]+)['\"]?[[:space:]]*(#.*)?$/\1/p"
          RUST_VERSION="$(sed -nE "${SED_EXPR}" toolchain.versions.yml | head -n1 | xargs)"
          if [ -z "${RUST_VERSION}" ]; then
            echo "failed to parse rust version from toolchain.versions.yml" >&2
            exit 1
          fi
          printf 'rust_version=%s\n' "${RUST_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust_version }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # tag: v2

      - name: Run magic-link flow proof
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p weltgewebe-api --features integration-testing \
            --test api_auth magic_link_full_round_trip_ \
            -- --test-threads=1 --color never | tee /tmp/magic-link-flow-proof.log

          if grep -Eq "running 0 tests|0 passed; 0 failed" /tmp/magic-link-flow-proof.log; then
            echo "ERROR: magic-link flow proof matched zero tests" >&2
            exit 1
          fi

          grep -Eq "running [1-9][0-9]* tests?" /tmp/magic-link-flow-proof.log
          grep -Eq "test result: ok\." /tmp/magic-link-flow-proof.log
          echo "PROVEN: magic-link flow proof tests passed"

  dependency-audit:
    name: dependency audit (on-demand)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # By default not on every PR/push: only manually or via "security" label
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'security'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f toolchain.versions.yml ]; then
            echo "toolchain.versions.yml not found" >&2
            exit 1
          fi
          SED_EXPR="s/^[[:space:]]*rust:[[:space:]]*['\"]?([^'\"#[:space:]]+)['\"]?[[:space:]]*(#.*)?$/\1/p"
          RUST_VERSION="$(sed -nE "${SED_EXPR}" toolchain.versions.yml | head -n1 | xargs)"
          if [ -z "${RUST_VERSION}" ]; then
            echo "failed to parse rust version from toolchain.versions.yml" >&2
            exit 1
          fi
          printf 'rust_version=%s\n' "${RUST_VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust_version }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --force --locked
      - name: cargo audit
        run: cargo audit
