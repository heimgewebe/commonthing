---
# Thin consumer wrapper — contract ownership stays in metarepo.
# Delegates to the canonical reusable metrics workflow; no local
# fetch / validate / schema-normalization logic needed here.
name: "📊 Metrics Snapshot & Validation"

permissions:
  contents: read
  actions: write
  checks: write

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  metrics:
    uses: heimgewebe/metarepo/.github/workflows/wgx-metrics.yml@5c86ca69c0e2ae78a736c151f8d851e5cdda811e # provenance: untagged (upstream publishes no release tags)
    with:
      metarepo_ref: "5c86ca69c0e2ae78a736c151f8d851e5cdda811e"
