---
name: policycheck
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
"on":
  pull_request:
    paths:
      - "policies/**"
      - "configs/app.defaults.yml"
      - "tools/py/**"
      - "toolchain.versions.yml"
      - ".github/workflows/policycheck.yml"
      - ".python-version"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # provenance: untagged (1 commit after v7.0.0)
        with:
          python-version-file: '.python-version'
      - name: Read uv version
        id: uv-version
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION=$(grep '^uv:' toolchain.versions.yml | cut -d '"' -f2)
          if [ -z "${UV_VERSION}" ]; then
            echo "failed to parse uv version from toolchain.versions.yml" >&2
            exit 1
          fi
          printf 'uv_version=%s\n' "${UV_VERSION}" >> "${GITHUB_OUTPUT}"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # tag: v8.3.2
        with:
          version: ${{ steps.uv-version.outputs.uv_version }}
      - run: uv sync --project tools/py --locked
      - run: uv run --project tools/py --locked python -m unittest scripts.ci.tests.test_policycheck -v
      - run: uv run --project tools/py --locked python tools/py/policycheck.py
