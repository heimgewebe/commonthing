---
name: "Validate Domain Schemas"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
"on":
  push:
    paths:
      - 'contracts/domain/**.schema.json'
      - 'contracts/domain/examples/**.json'
      - 'contracts/federation/v1/**.json'
      - 'scripts/contracts-domain-check.sh'
      - 'scripts/json-schema-check.mjs'
      - 'scripts/tests/json-schema-check.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.node-version'
      - '.github/workflows/contracts-domain.yml'
  pull_request:
    paths:
      - 'contracts/domain/**.schema.json'
      - 'contracts/domain/examples/**.json'
      - 'contracts/federation/v1/**.json'
      - 'scripts/contracts-domain-check.sh'
      - 'scripts/json-schema-check.mjs'
      - 'scripts/tests/json-schema-check.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.node-version'
      - '.github/workflows/contracts-domain.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # tag: v6
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # provenance: untagged (7 commits after v7.0.0)
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install pinned schema libraries
        run: pnpm install --frozen-lockfile

      - name: Compile domain schemas and validate examples
        run: pnpm contracts:domain:check

      - name: Compile Federation v1 schemas
        run: |
          set -euo pipefail
          for schema in contracts/federation/v1/*.schema.json; do
            echo "Compiling $schema"
            node scripts/json-schema-check.mjs compile \
              --schema "$schema" --spec draft2020
          done

      - name: Validate Federation v1 positive examples
        run: |
          set -euo pipefail
          node scripts/json-schema-check.mjs validate \
            --schema contracts/federation/v1/event.schema.json \
            --data contracts/federation/v1/examples/event.example.json \
            --spec draft2020
          node scripts/json-schema-check.mjs validate \
            --schema contracts/federation/v1/cell-descriptor.schema.json \
            --data contracts/federation/v1/examples/cell-descriptor.example.json \
            --spec draft2020

      - name: Reject Federation v1 negative fixtures
        run: |
          set -euo pipefail
          for fixture in contracts/federation/v1/examples/invalid/event.*.invalid.json; do
            echo "Expecting schema rejection: $fixture"
            set +e
            node scripts/json-schema-check.mjs validate \
              --schema contracts/federation/v1/event.schema.json \
              --data "$fixture" --spec draft2020
            rc=$?
            set -e
            if [[ "$rc" -ne 1 ]]; then
              echo "error: expected validation exit 1 for $fixture, got $rc" >&2
              exit 1
            fi
          done

      - name: Test repository schema checker
        run: pnpm test:json-schema-check
