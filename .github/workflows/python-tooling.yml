---
name: python-tooling

"on":
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/pyproject.toml"
      - "**/requirements*.txt"
      - "**/uv.lock"
      - ".github/workflows/python-tooling.yml"
      - ".python-version"
      - "toolchain.versions.yml"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/pyproject.toml"
      - "**/requirements*.txt"
      - "**/uv.lock"
      - ".github/workflows/python-tooling.yml"
      - ".python-version"
      - "toolchain.versions.yml"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Python tooling checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # tag: v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Read uv version
        id: uv-version
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f toolchain.versions.yml ]; then
            echo "toolchain.versions.yml not found" >&2
            exit 1
          fi
          UV_VERSION=$(grep '^uv:' toolchain.versions.yml | cut -d '"' -f2)
          if [ -z "${UV_VERSION}" ]; then
            echo "failed to parse uv version from toolchain.versions.yml" >&2
            exit 1
          fi
          printf 'uv_version=%s\n' "${UV_VERSION}" >> "${GITHUB_OUTPUT}"

      # Official uv setup (adds `uv` to PATH)
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # tag: v8.3.2
        with:
          version: ${{ steps.uv-version.outputs.uv_version }}

      - name: Cache uv downloads
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # provenance: untagged
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt', '**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Show uv version
        env:
          UV_VERSION: ${{ steps.uv-version.outputs.uv_version }}
        run: |
          set -euo pipefail
          uv --version
          uv --version | grep -F "${UV_VERSION}"

      - name: Sync dependencies if present
        shell: bash
        run: |
          set -euo pipefail
          found=0
          # Scan all dirs that contain a Python manifest.
          while IFS= read -r dir; do
            found=1
            if [ -f "$dir/uv.lock" ]; then
              echo "::group::uv sync (locked) in $dir"
              (cd "$dir" && uv sync --locked)
              echo "::endgroup::"
            elif [ -f "$dir/requirements.txt" ]; then
              echo "::group::uv pip sync in $dir"
              (cd "$dir" && uv pip sync requirements.txt)
              echo "::endgroup::"
            elif [ -f "$dir/pyproject.toml" ]; then
              echo "::group::uv sync in $dir"
              (cd "$dir" && uv sync)
              echo "::endgroup::"
            fi
          done < <(find . -type f \( -name "uv.lock" -o -name "requirements.txt" -o -name "pyproject.toml" \) \
            -exec dirname {} \; | sort -u)
          if [ "$found" -eq 0 ]; then
            echo "No Python dependency manifests found. Skipping sync."
          fi

      - name: Python sanity check
        run: python -c "import sys; print('python ok:', sys.version)"
