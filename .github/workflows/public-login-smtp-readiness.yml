---
name: Public login SMTP readiness

"on":
  pull_request:
    branches: [main]
    paths:
      - "scripts/ops/check_public_login_smtp_readiness.py"
      - "scripts/ops/reconcile_public_login_smtp_env.py"
      - "scripts/ci/tests/test_public_login_smtp_readiness.py"
      - "scripts/ci/tests/test_reconcile_public_login_smtp_env.py"
      - "docs/deploy/README.md"
      - "docs/deploy/vps.md"
      - ".github/workflows/public-login-smtp-readiness.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ops/check_public_login_smtp_readiness.py"
      - "scripts/ops/reconcile_public_login_smtp_env.py"
      - "scripts/ci/tests/test_public_login_smtp_readiness.py"
      - "scripts/ci/tests/test_reconcile_public_login_smtp_env.py"
      - "docs/deploy/README.md"
      - "docs/deploy/vps.md"
      - ".github/workflows/public-login-smtp-readiness.yml"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Public login SMTP readiness tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # provenance: untagged (after v7.0.0)
        with:
          python-version-file: ".python-version"

      - name: Install pytest
        run: python -m pip install pytest==9.0.3

      - name: Compile public-login SMTP operations
        run: |
          python -m py_compile \
            scripts/ops/check_public_login_smtp_readiness.py \
            scripts/ops/reconcile_public_login_smtp_env.py \
            scripts/ci/tests/test_public_login_smtp_readiness.py \
            scripts/ci/tests/test_reconcile_public_login_smtp_env.py

      - name: Run public-login SMTP readiness tests
        run: |
          python -m pytest -q \
            scripts/ci/tests/test_public_login_smtp_readiness.py \
            scripts/ci/tests/test_reconcile_public_login_smtp_env.py
