---
# Persistent browser-session proof (CI)
#
# Proves the browser-facing contract from issue #1378 with real Chromium
# profiles and the PostgreSQL-backed API session backend:
#
# - a second page in the same profile is authenticated immediately;
# - a persisted profile remains authenticated after browser restart;
# - a separate profile and a private context receive independent sessions;
# - logout propagates through the shared profile and invalidates the old server session;
# - the session cookie is persistent, conservatively bounded, and keeps the required security attributes.
name: Auth Session Persistence Proof

"on":
  pull_request:
    branches: [main]
    paths:
      - "apps/api/src/auth/session.rs"
      - "apps/api/src/auth/session_db.rs"
      - "apps/api/src/auth/mod.rs"
      - "apps/api/src/lib.rs"
      - "apps/api/src/middleware/auth.rs"
      - "apps/api/src/middleware/mod.rs"
      - "apps/api/src/middleware/authz.rs"
      - "apps/api/src/middleware/csrf.rs"
      - "apps/api/src/routes/auth.rs"
      - "apps/api/src/routes/mod.rs"
      - "apps/api/src/state.rs"
      - "apps/api/tests/api_auth.rs"
      - "apps/api/tests/db_session_store_persistence.rs"
      - "apps/web/package.json"
      - "apps/web/pnpm-lock.yaml"
      - "apps/web/playwright.auth-session.proof.config.ts"
      - "apps/web/tests/proofs/session-persistence.proof.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - "toolchain.versions.yml"
      - ".node-version"
      - ".github/workflows/auth-session-persistence-proof.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/src/auth/session.rs"
      - "apps/api/src/auth/session_db.rs"
      - "apps/api/src/auth/mod.rs"
      - "apps/api/src/lib.rs"
      - "apps/api/src/middleware/auth.rs"
      - "apps/api/src/middleware/mod.rs"
      - "apps/api/src/middleware/authz.rs"
      - "apps/api/src/middleware/csrf.rs"
      - "apps/api/src/routes/auth.rs"
      - "apps/api/src/routes/mod.rs"
      - "apps/api/src/state.rs"
      - "apps/api/tests/api_auth.rs"
      - "apps/api/tests/db_session_store_persistence.rs"
      - "apps/web/package.json"
      - "apps/web/pnpm-lock.yaml"
      - "apps/web/playwright.auth-session.proof.config.ts"
      - "apps/web/tests/proofs/session-persistence.proof.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - "toolchain.versions.yml"
      - ".node-version"
      - ".github/workflows/auth-session-persistence-proof.yml"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-session-persistence-proof:
    name: auth session persistence browser proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weltgewebe_ci_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d weltgewebe_ci_proof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CARGO_TERM_COLOR: always
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PLAYWRIGHT_HTML_REPORT_OPEN: never
      PLAYWRIGHT_HTML_REPORT: playwright-report-session
      PLAYWRIGHT_JUNIT_OUTPUT_NAME: session-results.xml
      AUTH_SESSION_PROOF_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/weltgewebe_ci_proof

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          set -euo pipefail
          SED_EXPR="s/^[[:space:]]*rust:[[:space:]]*['\"]?([^'\"#[:space:]]+)['\"]?[[:space:]]*(#.*)?$/\1/p"
          RUST_VERSION="$(sed -nE "${SED_EXPR}" toolchain.versions.yml | head -n1 | xargs)"
          if [ -z "${RUST_VERSION}" ]; then
            echo "failed to parse rust version from toolchain.versions.yml" >&2
            exit 1
          fi
          printf 'rust_version=%s\n' "${RUST_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust_version }}
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # tag: v2

      - name: Check Rust format
        run: cargo fmt --all -- --check

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # tag: v6
        with:
          version: 9.11.0

      - name: Setup Node
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # provenance: untagged (after v7.0.0)
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Pre-build API with integration-testing feature
        run: cargo build --locked --features integration-testing
        working-directory: apps/api

      - name: Get Playwright version
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_VERSION=$(pnpm exec playwright --version | awk '{print $2}')
          printf 'PLAYWRIGHT_VERSION=%s\n' "$PLAYWRIGHT_VERSION" >> "$GITHUB_ENV"
        working-directory: apps/web

      - name: Cache Playwright browsers
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # provenance: untagged
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      - name: Install Playwright Chromium with system deps
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ""
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run persistent browser-session proof
        run: pnpm test:proof:auth-session-persistence
        working-directory: apps/web

      - name: Upload proof summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: auth-session-persistence-proof-summary
          path: build/proofs/auth-session-persistence/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: auth-session-persistence-proof-report
          path: apps/web/playwright-report-session/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright traces and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: auth-session-persistence-proof-traces
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY_FILE="build/proofs/auth-session-persistence/proof-summary.json"
          printf '## Auth Session Persistence Proof\n\n' >> "${GITHUB_STEP_SUMMARY}"
          if [ -f "${SUMMARY_FILE}" ]; then
            printf '<details><summary>proof-summary.json</summary>\n\n```json\n' >> "${GITHUB_STEP_SUMMARY}"
            cat "${SUMMARY_FILE}" >> "${GITHUB_STEP_SUMMARY}"
            printf '\n```\n\n</details>\n' >> "${GITHUB_STEP_SUMMARY}"
          else
            printf '%s\n' 'No proof-summary.json produced.' >> "${GITHUB_STEP_SUMMARY}"
          fi
