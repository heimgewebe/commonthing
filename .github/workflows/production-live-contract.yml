---
name: Production live contract

"on":
  pull_request:
    branches: [main]
    paths:
      - "apps/web/scripts/generate-version.js"
      - "scripts/ops/verify_public_release_commit.py"
      - "scripts/ops/resolve_vps_public_bind.py"
      - "scripts/ops/weltgewebe_secure_receipt_io.py"
      - "scripts/ops/validate_web_deploy_archive.py"
      - "scripts/ops/ensure_web_push_vapid_env.py"
      - "scripts/ops/deploy-exact-commit-vps.sh"
      - "scripts/ops/reconcile-production-main-vps.sh"
      - "scripts/ops/install-production-reconciler.sh"
      - "scripts/ops/activate-production-reconciler-from-release.sh"
      - "scripts/weltgewebe-up"
      - "scripts/ci/tests/test_generate_version_env.py"
      - "scripts/ci/tests/test_verify_public_release_commit.py"
      - "scripts/ci/tests/test_resolve_vps_public_bind.py"
      - "scripts/ci/tests/test_secure_receipt_io.py"
      - "scripts/ci/tests/test_validate_web_deploy_archive.py"
      - "scripts/ci/tests/test_ensure_web_push_vapid_env.py"
      - "scripts/ci/tests/test_production_reconciler_contract.py"
      - "scripts/ci/tests/test_production_disk_pressure.py"
      - "scripts/ci/tests/test_deploy_exact_commit_integration.py"
      - "scripts/ci/tests/test_reconciler_public_germany_artifact_binding.py"
      - "scripts/ci/tests/test_production_receipt_resilience.py"
      - "infra/systemd/**"
      - ".github/workflows/production-live-contract.yml"
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('production-live-pr-{0}', github.event.pull_request.number)
        || 'production-live-main' }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  contract-tests:
    name: Production reconciler contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # provenance: untagged (after v7.0.0)
        with:
          python-version-file: ".python-version"
      - name: Compile Python tools
        run: |
          python -m py_compile scripts/ops/verify_public_release_commit.py
          python -m py_compile scripts/ops/resolve_vps_public_bind.py
          python -m py_compile scripts/ops/weltgewebe_secure_receipt_io.py
          python -m py_compile scripts/ops/validate_web_deploy_archive.py
          python -m py_compile scripts/ops/ensure_web_push_vapid_env.py
      - name: Check shell syntax and semantics
        run: |
          bash -n scripts/ops/deploy-exact-commit-vps.sh
          bash -n scripts/ops/reconcile-production-main-vps.sh
          bash -n scripts/ops/install-production-reconciler.sh
          bash -n scripts/ops/activate-production-reconciler-from-release.sh
          bash -n scripts/weltgewebe-up
          shellcheck \
            scripts/ops/deploy-exact-commit-vps.sh \
            scripts/ops/reconcile-production-main-vps.sh \
            scripts/ops/install-production-reconciler.sh \
            scripts/ops/activate-production-reconciler-from-release.sh \
            scripts/weltgewebe-up
      - name: Verify systemd units
        run: |
          sudo install -d -m 0755 /usr/local/libexec
          sudo install -m 0755 /bin/true \
            /usr/local/libexec/weltgewebe-reconcile-production-main
          systemd-analyze verify \
            infra/systemd/system/weltgewebe-production-reconcile.service \
            infra/systemd/system/weltgewebe-production-reconcile.timer
      - name: Verify generated version environment
        run: >-
          python -m unittest -v
          scripts/ci/tests/test_generate_version_env.py
      - name: Verify public release reader
        run: >-
          python -m unittest -v
          scripts/ci/tests/test_verify_public_release_commit.py
      - name: Verify VPS public Caddy bind resolver
        run: >-
          python -m unittest -v
          scripts/ci/tests/test_resolve_vps_public_bind.py
      - name: Verify secure receipt I/O
        run: >-
          python -m unittest -v
          scripts/ci/tests/test_secure_receipt_io.py
      - name: Verify deployment archive validator
        run: >-
          python -m unittest -v
          scripts/ci/tests/test_validate_web_deploy_archive.py
      - name: Verify Web Push VAPID bootstrap
        run: >-
          python -m unittest -v
          scripts/ci/tests/test_ensure_web_push_vapid_env.py
      - name: Verify production reconciler source contract
        run: >-
          python -m unittest -v
          scripts/ci/tests/test_production_reconciler_contract.py
      - name: Verify production disk-pressure guard
        run: >-
          python -m unittest -v
          scripts/ci/tests/test_production_disk_pressure.py
      - name: Verify exact-commit deployment integration
        run: >-
          python -m unittest -v
          scripts/ci/tests/test_deploy_exact_commit_integration.py
      - name: Reject stale public Germany PMTiles payload
        run: >-
          python -m unittest -v
          scripts/ci/tests/test_reconciler_public_germany_artifact_binding.py
      - name: Repair safe malformed deployment receipt
        run: >-
          python -m unittest -v
          scripts.ci.tests.test_production_receipt_resilience.ProductionReceiptResilienceTests.test_public_observation_repairs_safe_malformed_deployment_receipt
      - name: Preserve invocation contention evidence
        run: >-
          python -m unittest -v
          scripts.ci.tests.test_production_receipt_resilience.ProductionReceiptResilienceTests.test_inherited_contention_survives_shared_slot_overwrite
      - name: Normalize release modes independently of caller umask
        run: >-
          python -m unittest -v
          scripts.ci.tests.test_production_receipt_resilience.ProductionReceiptResilienceTests.test_permissive_caller_umask_produces_canonical_release_modes
      - name: Preserve reviewed cold-start preconditions
        run: >-
          python -m unittest -v
          scripts.ci.tests.test_production_receipt_resilience.ProductionReceiptResilienceTests.test_reviewed_resilience_preconditions_are_already_present

  review-diff:
    name: Exact review diff artifact
    if: github.event_name == 'pull_request'
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0
      - name: Generate exact binary patch
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          BASE_SHA="$(git rev-parse refs/remotes/origin/main)"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          patch="weltgewebe-pr-${PR_NUMBER}-${HEAD_SHA}.patch"
          git diff --binary "$BASE_SHA...$HEAD_SHA" -- > "$patch"
          bytes="$(stat --format=%s "$patch")"
          ((bytes > 0 && bytes <= 67108864))
          digest="$(sha256sum "$patch" | awk '{print $1}')"
          printf 'base=%s\nhead=%s\nsha256=%s\nbytes=%s\n' \
            "$BASE_SHA" "$HEAD_SHA" "$digest" "$bytes" \
            > review-diff-manifest.txt
      - name: Upload exact review diff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: review-diff-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            weltgewebe-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}.patch
            review-diff-manifest.txt
          if-no-files-found: error
          retention-days: 30

  verify-live-commit:
    name: Exact main commit is live
    if: github.event_name != 'pull_request'
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # provenance: untagged (after v7.0.0)
        with:
          python-version-file: ".python-version"
      - name: Resolve exact main commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Verify public frontend and API identity
        run: |
          wait_seconds=0
          if [[ "${{ github.event_name }}" == "push" ]]; then
            wait_seconds=1200
          fi
          python scripts/ops/verify_public_release_commit.py \
            --expected-commit "${{ steps.target.outputs.commit }}" \
            --wait-seconds "$wait_seconds" \
            --poll-seconds 15 \
            --output production-live-receipt.json
      - name: Upload production receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: production-live-${{ steps.target.outputs.commit }}
          path: production-live-receipt.json
          if-no-files-found: error
          retention-days: 30
