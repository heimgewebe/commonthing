---
name: wgx-smoke
permissions:
  contents: read

"on":
  workflow_dispatch:
  push:
    paths:
      - ".wgx/**"
      - "docs/wgx-konzept.md"
      - ".github/workflows/wgx-smoke.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Compatibility filename only: verification policy is owned by Metarepo.
    uses: heimgewebe/metarepo/.github/workflows/reusable-repo-verify.yml@fe6950616b2d06343e284a56a8944e0a36f1f972
    with:
      mode: smoke
    permissions:
      contents: read
