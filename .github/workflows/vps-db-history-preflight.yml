---
name: VPS DB history preflight

"on":
  pull_request:
    branches: [main]
    paths:
      - "docs/deploy/vps-db-initialization-boundary.md"
      - "docs/deploy/vps.md"
      - "docs/deploy/vps-migration-safe-runtime-smoke.md"
      - "infra/compose/compose.vps.override.yml"
      - "scripts/weltgewebe-up"
      - "scripts/ops/check_vps_db_migration_history_shape.py"
      - "scripts/ci/tests/test_vps_db_history_preflight_docs.py"
      - "scripts/ci/tests/test_vps_db_initialization_boundary_docs.py"
      - "scripts/ci/tests/test_vps_db_migration_history_shape.py"
      - "scripts/ci/tests/test_vps_credential_source_defaults.py"
      - "scripts/ci/tests/test_vps_migration_safe_runtime_env.py"
      - "scripts/ci/tests/test_vps_migration_safe_runtime_env_boundaries.py"
      - "scripts/ci/tests/test_vps_migration_safe_runtime_env_compose_semantics.py"
      - "scripts/ci/tests/test_vps_runtime_yaml_edges.py"
      - ".github/workflows/vps-db-history-preflight.yml"
  push:
    branches: [main]
    paths:
      - "docs/deploy/vps-db-initialization-boundary.md"
      - "docs/deploy/vps.md"
      - "docs/deploy/vps-migration-safe-runtime-smoke.md"
      - "infra/compose/compose.vps.override.yml"
      - "scripts/weltgewebe-up"
      - "scripts/ops/check_vps_db_migration_history_shape.py"
      - "scripts/ci/tests/test_vps_db_history_preflight_docs.py"
      - "scripts/ci/tests/test_vps_db_initialization_boundary_docs.py"
      - "scripts/ci/tests/test_vps_db_migration_history_shape.py"
      - "scripts/ci/tests/test_vps_credential_source_defaults.py"
      - "scripts/ci/tests/test_vps_migration_safe_runtime_env.py"
      - "scripts/ci/tests/test_vps_migration_safe_runtime_env_boundaries.py"
      - "scripts/ci/tests/test_vps_migration_safe_runtime_env_compose_semantics.py"
      - "scripts/ci/tests/test_vps_runtime_yaml_edges.py"
      - ".github/workflows/vps-db-history-preflight.yml"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: VPS DB history preflight tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # provenance: untagged (1 commit after v7.0.0)
        with:
          python-version-file: ".python-version"

      - name: Install pytest
        run: python -m pip install pytest==9.0.3

      - name: Run VPS DB history preflight tests
        run: |
          set -euo pipefail
          python -m pytest \
            scripts/ci/tests/test_vps_db_migration_history_shape.py \
            scripts/ci/tests/test_vps_db_history_preflight_docs.py \
            scripts/ci/tests/test_vps_db_initialization_boundary_docs.py \
            scripts/ci/tests/test_vps_credential_source_defaults.py \
            scripts/ci/tests/test_vps_migration_safe_runtime_env.py \
            scripts/ci/tests/test_vps_migration_safe_runtime_env_boundaries.py \
            scripts/ci/tests/test_vps_migration_safe_runtime_env_compose_semantics.py \
            scripts/ci/tests/test_vps_runtime_yaml_edges.py \
            -q
