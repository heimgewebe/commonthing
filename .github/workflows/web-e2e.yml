---
name: Web E2E (manual)

"on":
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write # required for npm cache restore
    env:
      HEADLESS: "1"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      PREVIEW_PORT: "5173"
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
      GEWEBE_API_BASE: "http://127.0.0.1:8080"
      PUBLIC_GEWEBE_API_BASE: "http://127.0.0.1:8080"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # tag: v6
        with:
          run_install: false

      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # provenance: untagged (7 commits after v7.0.0)
        with:
          node-version-file: '.node-version'
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter weltgewebe-web exec playwright install --with-deps
      - name: Build app
        run: pnpm --filter weltgewebe-web build:e2e

      - name: Generate demo data
        run: scripts/dev/generate-demo-data.sh
        working-directory: .

      - name: Start demo API
        run: |
          PORT=8080 node scripts/dev/gewebe-demo-server.mjs > /tmp/demo-api.log 2>&1 &
        working-directory: .

      - name: Start preview server
        run: |
          pnpm --filter weltgewebe-web preview -- \
            --host 0.0.0.0 --port "${PREVIEW_PORT}" --strictPort > /tmp/preview.log 2>&1 &
          echo "$!" > /tmp/preview.pid

      - name: Wait for preview server
        env:
          PREVIEW_PID_FILE: /tmp/preview.pid
          PREVIEW_LOG: /tmp/preview.log
        run: scripts/ci/wait-for-preview.sh
        working-directory: .

      - name: Wait for API (robust)
        run: scripts/ci/wait-for-api.sh

      - name: Run tests
        run: pnpm --filter weltgewebe-web test:ci
      - name: Upload HTML report (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/**
            apps/web/playwright-report/results.xml
          if-no-files-found: ignore
      - name: Show report summary (always)
        if: always()
        run: |
          echo "✅ Playwright report stored at: apps/web/playwright-report/"
          echo "ℹ️ To view locally, run:"
          echo "npx playwright show-report apps/web/playwright-report"
      - name: Upload traces (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: playwright-traces
          path: apps/web/test-results/**/*.zip
          if-no-files-found: ignore
