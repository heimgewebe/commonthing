---
name: CI

permissions:
  contents: read

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Verwende die Standard-Bash von GitHub Actions, ohne eigenes Template.
defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  docs-changes:
    name: Detect docs updates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      hygiene: ${{ steps.filter.outputs.hygiene }}
      heavy: ${{ steps.filter.outputs.heavy }}
      api_runtime: ${{ steps.filter.outputs.api_runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # tag: v4.0.2
        with:
          filters: |
            docs:
              - '**/*.md'
              - '.markdownlint.*'
              - '.yamllint*'
            hygiene:
              - '**/*.md'
              - '.markdownlint.*'
              - '.yamllint*'
              - '.github/workflows/*.yml'
              - '.github/workflows/*.yaml'
              - '**/*.sh'
              - '**/*.bash'
              - 'Justfile'
              - 'scripts/tools/list-shell-files.py'
              - 'scripts/**'
            api_runtime:
              - '.github/workflows/ci.yml'
              - '.github/workflows/domain-scale.yml'
              - 'configs/performance/domain-scale.v1.json'
              - 'configs/app.defaults.yml'
              - 'policies/limits.yaml'
              - 'policies/performance.v1.json'
              - '.python-version'
              - 'scripts/performance/**'
              - 'scripts/basemap/run-measured-container.py'
              - 'scripts/tests/test_domain_scale.py'
              - 'scripts/ci/tests/test_api_runtime_evidence.py'
              - 'scripts/ci/tests/test_api_runtime_workflow.py'
              - 'apps/api/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            heavy:
              - '.github/workflows/*.yml'
              - '.github/workflows/*.yaml'
              - 'apps/**'
              - 'ci/**'
              - 'contracts/**'
              - 'infra/**'
              - 'policies/**'
              - 'scripts/**'
              - 'src/**'
              - 'tests/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Justfile'
              - 'Makefile'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'toolchain.versions.yml'
              - '.node-version'
              - '.nvmrc'
              - '.python-version'

  api-runtime-proof:
    name: API runtime exact-revision evidence
    needs: docs-changes
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        needs.docs-changes.outputs.api_runtime == 'true'
      }}
    uses: ./.github/workflows/domain-scale.yml

  guard-tests:
    name: Core Guard Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - name: Setup Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # provenance: untagged (after v7.0.0)
        with:
          python-version-file: '.python-version'

      - name: Read uv version
        id: guard-uv-version
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION=$(grep '^uv:' toolchain.versions.yml | cut -d '"' -f2)
          if [ -z "${UV_VERSION}" ]; then
            echo "failed to parse uv version from toolchain.versions.yml" >&2
            exit 1
          fi
          printf 'uv_version=%s\n' "${UV_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # tag: v8.3.2
        with:
          version: ${{ steps.guard-uv-version.outputs.uv_version }}

      - name: Sync hash-locked guard dependencies
        run: uv sync --project tools/py --locked

      - name: Check guard syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/guard/domain-multi-instance-guard.sh
          bash -n scripts/tests/test_domain_multi_instance_guard.sh
          bash -n scripts/guard/prod-public-base-url-guard.sh
          bash -n scripts/tests/test_prod_public_base_url_guard.sh
          bash -n scripts/tests/test_verify_deployment.sh
          bash -n scripts/tests/test_verify_deployment_isolation.sh
          bash -n scripts/guard/security-headers-guard.sh
          bash -n scripts/guard/lockfile-guard.sh
          bash -n scripts/guard/compose-image-guard.sh
          bash -n scripts/guard/caddy-build-header-guard.sh
          bash -n scripts/ops/postgres-backup.sh
          bash -n scripts/ops/postgres-restore-proof.sh
          bash -n scripts/ops/postgres-restore-latest-proof.sh
          bash -n scripts/ops/install-web-artifact.sh
          bash -n scripts/ops/verify-api-release-identity.sh
          bash -n scripts/tests/test_security_headers_guard.sh
          bash -n scripts/tests/test_repo_contract_guards.sh
          bash -n scripts/tests/test_postgres_backup_restore_contract.sh
          bash -n scripts/tests/test_web_artifact_install_contract.sh
          bash -n scripts/tests/test_api_release_identity_contract.sh
          bash -n scripts/tests/test_weltgewebe_up_deploy_scope.sh
          bash -n scripts/preflight/runtime_contract.sh
          bash -n scripts/preflight/csp_contract_static.sh
          bash -n scripts/tests/test_runtime_contract.sh
          bash -n scripts/tests/test_csp_contract_static.sh
          bash -n scripts/guard/run.sh

      - name: Run guard fixture suites
        shell: bash
        run: |
          set -euo pipefail
          for t in \
            scripts/tests/test_token_leak_guard.sh \
            scripts/tests/test_verify_deployment.sh \
            scripts/tests/test_verify_deployment_isolation.sh \
            scripts/tests/test_compose_volumes_guard.sh \
            scripts/tests/test_metrics_ref_guard.sh \
            scripts/tests/test_domain_multi_instance_guard.sh \
            scripts/tests/test_prod_public_base_url_guard.sh \
            scripts/tests/test_security_headers_guard.sh \
            scripts/tests/test_repo_contract_guards.sh \
            scripts/tests/test_postgres_backup_restore_contract.sh \
            scripts/tests/test_web_artifact_install_contract.sh \
            scripts/tests/test_api_release_identity_contract.sh \
            scripts/tests/test_weltgewebe_up_deploy_scope.sh \
            scripts/tests/test_runtime_contract.sh \
            scripts/tests/test_csp_contract_static.sh
          do
            echo "── $t ──"
            bash "$t"
          done

      - name: Validate production public base URL contract
        shell: bash
        run: |
          set -euo pipefail
          REPO_ROOT="$GITHUB_WORKSPACE" \
            bash scripts/guard/prod-public-base-url-guard.sh

      - name: Run core guard orchestrator
        shell: bash
        run: bash scripts/guard/run.sh

      - name: Validate canonical truth contract
        run: uv run --project tools/py --locked python -m unittest scripts.ci.tests.test_canonical_truth_contract -v

      - name: Validate Garnrolle ontology contract
        run: python3 -m unittest scripts.ci.tests.test_garnrolle_ontology_contract -v

      - name: Check out pinned convergence protocol
        env:
          PROTOCOL_ROOT: ${{ runner.temp }}/konvergenzregelkreis
        run: |
          set -euo pipefail
          protocol_head_file=contracts/convergence/v1.0.0/PINNED_PROTOCOL_HEAD
          mapfile -t protocol_head_lines < "${protocol_head_file}"
          if (( ${#protocol_head_lines[@]} != 1 )); then
            echo "PINNED_PROTOCOL_HEAD must contain exactly one line" >&2
            exit 1
          fi
          PROTOCOL_HEAD=${protocol_head_lines[0]}
          if [[ ! "${PROTOCOL_HEAD}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "PINNED_PROTOCOL_HEAD must be 40 lowercase hexadecimal characters" >&2
            exit 1
          fi
          test ! -e "${PROTOCOL_ROOT}"
          git init "${PROTOCOL_ROOT}"
          git -C "${PROTOCOL_ROOT}" remote add origin \
            https://github.com/heimgewebe/konvergenzregelkreis.git
          git -C "${PROTOCOL_ROOT}" fetch --depth=1 origin "${PROTOCOL_HEAD}"
          fetched_head=$(git -C "${PROTOCOL_ROOT}" rev-parse FETCH_HEAD)
          test "${fetched_head}" = "${PROTOCOL_HEAD}"
          git -C "${PROTOCOL_ROOT}" checkout --detach FETCH_HEAD

          # The exact object id and fsck bind CI to one Git commit object.
          # They do not prove a signer identity, so verify-commit is intentionally
          # not required until a trusted signing identity is defined.
          if [ "$(git -C "${PROTOCOL_ROOT}" cat-file -t "${PROTOCOL_HEAD}")" != "commit" ]; then
            echo "Error: PINNED_PROTOCOL_HEAD is not a commit" >&2
            exit 1
          fi
          git -C "${PROTOCOL_ROOT}" fsck --strict --no-dangling

          test "$(git -C "${PROTOCOL_ROOT}" rev-parse HEAD)" = "${PROTOCOL_HEAD}"
          python3 -m pip install --disable-pip-version-check --no-input \
            'jsonschema==4.26.0'

      - name: Validate convergence adapter contract
        env:
          KONVERGENZREGELKREIS_ROOT: ${{ runner.temp }}/konvergenzregelkreis
        run: python3 -m unittest scripts.ci.tests.test_convergence_adapter_contract -v

      - name: Validate merge governance contracts
        run: uv run --project tools/py --locked python -m unittest scripts.quality.tests.test_review_governance -v

  ci:
    needs: docs-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          set -e
          YQ_VERSION="4.44.3"
          YQ_SHA256="a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7"
          YQ_DIR="$HOME/.local/bin"
          YQ_BIN="$YQ_DIR/yq"
          mkdir -p "$YQ_DIR"

          if [[ ! -f "$YQ_BIN" ]] || ! "$YQ_BIN" --version 2>/dev/null | grep -q "$YQ_VERSION"; then
            echo "Installing yq v${YQ_VERSION}..."
            INSTALL_TMPDIR=$(mktemp -d)
            trap 'rm -rf "$INSTALL_TMPDIR"' EXIT
            YQ_DOWNLOAD="$INSTALL_TMPDIR/yq_linux_amd64"
            wget -qO "$YQ_DOWNLOAD" "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
            printf '%s  %s\n' "$YQ_SHA256" "$YQ_DOWNLOAD" | sha256sum -c -
            install -m 0755 "$YQ_DOWNLOAD" "$YQ_BIN"
            rm -rf "$INSTALL_TMPDIR"
            trap - EXIT
          else
            echo "yq v${YQ_VERSION} already installed"
          fi

          echo "$YQ_DIR" >> "$GITHUB_PATH"

      - name: Verify yq
        run: $HOME/.local/bin/yq --version

      - name: Read toolchain versions
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          if [ ! -x "$HOME/.local/bin/yq" ]; then
            echo "yq is not installed or not executable at $HOME/.local/bin/yq" >&2
            exit 1
          fi

          if [ ! -f toolchain.versions.yml ]; then
            echo "toolchain.versions.yml not found" >&2
            exit 1
          fi

          # Function to extract and validate version
          get_version() {
            local key=$1
            local val
            val=$("$HOME/.local/bin/yq" -r ".${key} // \"\"" toolchain.versions.yml | xargs)
            if [ -z "$val" ] || [ "$val" == "null" ]; then
              echo "failed to parse ${key} version from toolchain.versions.yml" >&2
              exit 1
            fi
            echo "$val"
          }

          RUST=$(get_version "rust")
          UV=$(get_version "uv")
          DENY=$(get_version "cargo-deny")

          echo "Found versions: Rust=$RUST, uv=$UV, cargo-deny=$DENY"

          echo "RUST_VERSION=${RUST}" >> "$GITHUB_ENV"
          echo "UV_VERSION=${UV}" >> "$GITHUB_ENV"
          echo "DENY_VERSION=${DENY}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
        env:
          CARGO_TERM_COLOR: always

      - name: Cache Cargo artifacts
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # provenance: untagged
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: >-
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # tag: v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # provenance: untagged (after v7.0.0)
        with:
          node-version-file: '.node-version'
          check-latest: false
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/web/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # provenance: untagged (after v7.0.0)
        with:
          python-version-file: '.python-version'

      - name: Install docmeta Python dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir pytest==9.0.3 pyyaml==6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # tag: v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          ignore-nothing-to-cache: true

      - name: Install cargo-deny
        run: |
          set -euo pipefail
          # DENY_VERSION kommt aus toolchain.versions.yml (Step "Read toolchain versions").
          if [ -z "${DENY_VERSION:-}" ]; then
            echo "DENY_VERSION is not set (expected from toolchain.versions.yml)" >&2
            exit 1
          fi
          DENY_SHA256="663f655b23c58e7d8eaf1c6b6bd8e197742757b5314bd292fd8dcbc0a16581c6"
          DENY_DIR="$HOME/.local/bin"
          DENY_BIN="$DENY_DIR/cargo-deny"
          mkdir -p "$DENY_DIR"

          if [[ ! -f "$DENY_BIN" ]] || ! "$DENY_BIN" --version 2>/dev/null | grep -q "${DENY_VERSION}"; then
            echo "Installing cargo-deny v${DENY_VERSION}..."
            INSTALL_TMPDIR=$(mktemp -d)
            trap 'rm -rf "$INSTALL_TMPDIR"' EXIT
            TARBALL_URL="https://github.com/EmbarkStudios/cargo-deny/releases/download"
            TARBALL_URL="${TARBALL_URL}/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            TARBALL_PATH="$INSTALL_TMPDIR/cargo-deny.tar.gz"
            EXTRACT_DIR="$INSTALL_TMPDIR/extract"
            mkdir -p "$EXTRACT_DIR"
            curl -sLf "$TARBALL_URL" -o "$TARBALL_PATH"
            printf '%s  %s\n' "$DENY_SHA256" "$TARBALL_PATH" | sha256sum -c -
            tar xzf "$TARBALL_PATH" -C "$EXTRACT_DIR" --strip-components=1
            install -m 0755 "$EXTRACT_DIR/cargo-deny" "$DENY_BIN"
            rm -rf "$INSTALL_TMPDIR"
            trap - EXIT
          else
            echo "cargo-deny v${DENY_VERSION} already installed"
          fi

          echo "$DENY_DIR" >> "$GITHUB_PATH"

      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # tag: v4.0.0

      - name: Show tool versions
        run: |
          rustc --version
          python --version
          uv --version
          cargo-deny --version
          just --version

      # CI Test Architecture:
      #   just ci — canonical web unit tests for pull requests and main pushes,
      #             plus build/lint/typecheck, API tests and cargo-deny.
      #   web.yml — push-only unit fallback for non-main web branches, plus Playwright E2E.
      #   Core Guard Tests remain in the independent guard-tests job.
      - name: Validate project
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          just ci
          make ci-validate

  web-e2e:
    name: Web E2E
    needs: ci
    uses: ./.github/workflows/reusable-web-check.yml
    with:
      job_name: Web E2E
      timeout_minutes: 20
      run_unit_tests: false
      run_typecheck: false
      run_lint: false
      run_build: false
      run_demo_api: true
      suite: ci
      artifact_name: playwright-report-${{ github.run_id }}-web-e2e

  web-runtime-proof:
    name: Web runtime performance proof
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      PLAYWRIGHT_HTML_REPORT_OPEN: never
      PLAYWRIGHT_HTML_REPORT: playwright-report/web-runtime
      PLAYWRIGHT_JUNIT_OUTPUT_NAME: web-runtime-results.xml
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # tag: v6
        with:
          run_install: false

      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # provenance: untagged (after v7.0.0)
        with:
          node-version-file: '.node-version'
          check-latest: false
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Chromium
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # provenance: untagged
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-web-runtime-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-web-runtime-
            ${{ runner.os }}-ms-playwright-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Measure exact-revision browser runtime
        env:
          WELTGEWEBE_EXACT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          pnpm test:proof:web-runtime
          pnpm assert:proof:web-runtime

      - name: Upload web runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: web-runtime-evidence-${{ github.run_id }}
          path: build/proofs/web-runtime/
          if-no-files-found: error
          retention-days: 30

      - name: Upload web runtime Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: web-runtime-report-${{ github.run_id }}
          path: apps/web/playwright-report/web-runtime/
          if-no-files-found: warn
          retention-days: 14
  postgres-proofs:
    name: PostgreSQL integration proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/weltgewebe_t002_test
      PG_DIRECT_URL: postgres://postgres:postgres@127.0.0.1:5432/weltgewebe_t002_test
      POSTGRES_PROOF_PROVISION_NATS: "1"
      POSTGRES_PROOF_ALLOW_RESET: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: 1.89.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # tag: v2
      - name: Run PostgreSQL and multi-instance proof suite
        run: scripts/ci/run-postgres-integration-proofs.sh

  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - name: Setup Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # provenance: untagged (after v7.0.0)
        with:
          python-version-file: '.python-version'

      - name: Read tool versions
        id: tool-versions
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION=$(grep '^uv:' toolchain.versions.yml | cut -d '"' -f2)
          if [ -z "${UV_VERSION}" ]; then
            echo "failed to parse uv version from toolchain.versions.yml" >&2
            exit 1
          fi
          printf 'uv_version=%s\n' "${UV_VERSION}" >> "${GITHUB_OUTPUT}"
          RUFF_VERSION=$(grep '^ruff:' toolchain.versions.yml | cut -d '"' -f2)
          if [ -z "${RUFF_VERSION}" ]; then
            echo "failed to parse ruff version from toolchain.versions.yml" >&2
            exit 1
          fi
          printf 'ruff_version=%s\n' "${RUFF_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # tag: v8.3.2
        with:
          version: ${{ steps.tool-versions.outputs.uv_version }}

      # Statische Pruefung des gesamten Python-Bestands. Regelauswahl in
      # ruff.toml bewusst eng (E9 + Pyflakes): Fehlerklassen, keine Stilregeln.
      # Dieser Job liegt bewusst in ci.yml, weil nur dessen Ergebnisse vom
      # "Required merge gate" aggregiert werden.
      - name: Ruff lint
        env:
          RUFF_VERSION: ${{ steps.tool-versions.outputs.ruff_version }}
        run: |
          set -euo pipefail
          uv tool run "ruff@${RUFF_VERSION}" check --no-cache .

  lint-docs:
    name: Docs & Shell Hygiene
    needs: docs-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0

      - name: Shell lint
        run: |
          set -euo pipefail
          echo "Installing shell linters..."
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends shellcheck shfmt
          shell_files="${RUNNER_TEMP:-/tmp}/weltgewebe-shell-files.txt"
          python3 scripts/tools/list-shell-files.py > "${shell_files}"
          if [ -s "${shell_files}" ]; then
            xargs -0 -a "${shell_files}" -n 1 bash -n --
            xargs -0 -a "${shell_files}" shfmt -d -i 2 -ci -sr --
            xargs -0 -a "${shell_files}" shellcheck -S style --
          else
            echo "No shell files found."
          fi

      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # tag: v24.1.0
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !**/dist/**
            !**/.git/**

      - name: Cache lychee responses
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # provenance: untagged
        with:
          path: .lycheecache
          key: ${{ runner.os }}-lychee-${{ hashFiles('**/*.md', '.lychee.toml') }}
          restore-keys: |
            ${{ runner.os }}-lychee-

      - name: Link check (lychee)
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # tag: v2
        with:
          failIfEmpty: false
          # lychee v0.15 expects integer seconds for retry wait time
          args: >
            --no-progress
            --config .lychee.toml
            --accept "200,206,301,302,308,429,999"
            --timeout 20
            --max-concurrency 3
            --retry-wait-time 3
            --max-retries 3
            --user-agent "heimgewebe-ci-lychee"
            --exclude 'https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)(:\d+)?(/.*)?'
            --exclude-path 'node_modules'
            --exclude-path 'dist'
            --exclude-path '.git'
            --cache
            '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Link check (lychee - verbose retry)
        if: ${{ steps.lychee.outcome == 'failure' }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # tag: v2
        with:
          failIfEmpty: false
          args: >
            --no-progress
            --config .lychee.toml
            --accept "200,206,301,302,308,429,999"
            --timeout 20
            --max-concurrency 3
            --retry-wait-time 3
            --max-retries 3
            --verbose
            --user-agent "heimgewebe-ci-lychee"
            --exclude 'https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)(:\d+)?(/.*)?'
            --exclude-path 'node_modules'
            --exclude-path 'dist'
            --exclude-path '.git'
            --cache
            --max-cache-age 1d
            '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint YAML and JSON files
        run: |
          set -euo pipefail
          echo "Linting YAML files..."
          python -m pip install --user yamllint
          export PATH="$HOME/.local/bin:$PATH"
          git ls-files -z -- '*.yml' '*.yaml' | xargs -r -0 --no-run-if-empty \
            yamllint --strict -c .yamllint.yml
          echo "Checking for jq..."
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found, installing..."
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq
          fi
          echo "Linting JSON files..."
          git ls-files -z -- '*.json' ':!:**/package-lock.json' | xargs -r -0 --no-run-if-empty \
            jq -n 'inputs' >/dev/null
          echo "Linting completed."
  required-merge-gate:
    name: Required merge gate
    if: ${{ always() }}
    needs:
      - docs-changes
      - api-runtime-proof
      - guard-tests
      - ci
      - web-e2e
      - web-runtime-proof
      - postgres-proofs
      - lint-docs
      - python-lint
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required proof jobs
        run: |
          set -euo pipefail
          results=(
            "docs-changes=${{ needs.docs-changes.result }}"
            "guard-tests=${{ needs.guard-tests.result }}"
            "ci=${{ needs.ci.result }}"
            "web-e2e=${{ needs.web-e2e.result }}"
            "web-runtime-proof=${{ needs.web-runtime-proof.result }}"
            "postgres-proofs=${{ needs.postgres-proofs.result }}"
            "lint-docs=${{ needs.lint-docs.result }}"
            "python-lint=${{ needs.python-lint.result }}"
          )
          failed=0
          for item in "${results[@]}"; do
            printf '%s\n' "$item"
            [[ "$item" == *=success ]] || failed=1
          done

          api_runtime_required="${{
            github.event_name == 'workflow_dispatch' ||
            needs.docs-changes.outputs.api_runtime == 'true'
          }}"
          api_runtime_result="${{ needs.api-runtime-proof.result }}"
          printf 'api-runtime-required=%s\n' "${api_runtime_required}"
          printf 'api-runtime-proof=%s\n' "${api_runtime_result}"
          if [[ "${api_runtime_required}" == "true" ]]; then
            [[ "${api_runtime_result}" == "success" ]] || failed=1
          else
            [[ "${api_runtime_result}" == "skipped" ]] || failed=1
          fi

          (( failed == 0 )) || exit 1
