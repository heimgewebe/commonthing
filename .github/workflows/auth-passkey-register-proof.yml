---
# Auth Passkey Register Positive Proof (CI)
#
# Executes the existing local proof for the positive passkey
# register-verify path inside CI:
#
#   apps/web/tests/proofs/passkey-register-positive.proof.ts
#
# The proof is driven by Playwright/Chromium plus a virtual
# WebAuthn authenticator. It exercises the real API
# (`cargo run --locked --features integration-testing`) through
# the Vite preview server proxy and asserts the documented
# proof-summary invariants:
#
#   - register_options_status: 200
#   - register_verify_status: 200
#   - register_verify_set_cookie: null
#   - session_cookie_unchanged: true
#   - stored_credential_reflected: true
#   - auth_options_status: 200
#   - auth_verify_status: 200
#   - auth_verify_session_cookie_present: true
#   - virtual_authenticator_credentials > 0
#
# Scope distinction:
#   This workflow runs ONLY the auth passkey register positive
#   proof (`pnpm test:proof:auth-passkey-register`).
#   It does NOT touch or share configuration with the basemap
#   proof (`pnpm test:proof:basemap-real`, see
#   `.github/workflows/basemap-runtime-proof.yml`).
name: Auth Passkey Register Proof

"on":
  pull_request:
    branches: [main]
    paths:
      - "apps/api/src/**"
      - "apps/api/Cargo.toml"
      - "apps/api/tests/api_auth.rs"
      - "apps/web/package.json"
      - "apps/web/pnpm-lock.yaml"
      - "apps/web/playwright.auth.proof.config.ts"
      - "apps/web/src/routes/build/**"
      - "apps/web/tests/proofs/passkey-register-positive.proof.ts"
      - "apps/web/vite.config.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - "toolchain.versions.yml"
      - ".node-version"
      - ".github/workflows/auth-passkey-register-proof.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/src/**"
      - "apps/api/Cargo.toml"
      - "apps/api/tests/api_auth.rs"
      - "apps/web/package.json"
      - "apps/web/pnpm-lock.yaml"
      - "apps/web/playwright.auth.proof.config.ts"
      - "apps/web/src/routes/build/**"
      - "apps/web/tests/proofs/passkey-register-positive.proof.ts"
      - "apps/web/vite.config.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - "toolchain.versions.yml"
      - ".node-version"
      - ".github/workflows/auth-passkey-register-proof.yml"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-passkey-register-proof:
    name: auth passkey register positive proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PLAYWRIGHT_HTML_REPORT_OPEN: never
      DATABASE_URL: postgres://welt:gewebe@localhost:5432/weltgewebe_ci_proof
      AUTH_PASSKEY_PROOF_POSTGRES: "1"
      PLAYWRIGHT_JUNIT_OUTPUT_NAME: results.xml
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: welt
          POSTGRES_PASSWORD: gewebe
          POSTGRES_DB: weltgewebe_ci_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1

      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          set -euo pipefail
          SED_EXPR="s/^[[:space:]]*rust:[[:space:]]*['\"]?([^'\"#[:space:]]+)['\"]?[[:space:]]*(#.*)?$/\1/p"
          RUST_VERSION="$(sed -nE "${SED_EXPR}" toolchain.versions.yml | head -n1 | xargs)"
          if [ -z "${RUST_VERSION}" ]; then
            echo "failed to parse rust version from toolchain.versions.yml" >&2
            exit 1
          fi
          printf 'rust_version=%s\n' "${RUST_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag: v1
        with:
          toolchain: ${{ steps.rust-version.outputs.rust_version }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # tag: v2

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # tag: v6
        with:
          version: 9.11.0

      - name: Setup Node
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # provenance: untagged (after v7.0.0)
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Pre-build API with integration-testing feature
        # Builds the API binary once with cached cargo so the Playwright
        # webServer step does not have to compile from scratch under its
        # own 120s readiness timeout.
        run: cargo build --locked --features integration-testing
        working-directory: apps/api

      - name: Get Playwright version
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_VERSION=$(pnpm exec playwright --version | awk '{print $2}')
          printf 'PLAYWRIGHT_VERSION=%s\n' "$PLAYWRIGHT_VERSION" >> "$GITHUB_ENV"
        working-directory: apps/web

      - name: Cache Playwright browsers
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # provenance: untagged
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      - name: Install Playwright Chromium with system deps
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ""
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - name: Start pinned JetStream for readiness-backed proof
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$(
            python3 - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(
              Path("scripts/ci/postgres-proof-contract.json").read_text(encoding="utf-8")
          )
          print(contract["jetstream_image"])
          PY
          )"
          CONTAINER="weltgewebe-passkey-nats-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'PASSKEY_NATS_CONTAINER=%s\n' "${CONTAINER}" >> "${GITHUB_ENV}"
          docker run --detach --rm \
            --name "${CONTAINER}" \
            --publish 127.0.0.1::4222 \
            "${IMAGE}" -js > /dev/null
          BINDING="$(docker port "${CONTAINER}" 4222/tcp)"
          PORT="${BINDING##*:}"
          if [[ ! "${PORT}" =~ ^[0-9]+$ ]]; then
            echo "could not resolve JetStream port from ${BINDING}" >&2
            exit 1
          fi
          python3 - "${PORT}" <<'PY'
          import socket
          import sys
          import time

          port = int(sys.argv[1])
          deadline = time.monotonic() + 20
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", port), timeout=1):
                      break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit("JetStream proof port did not become reachable")
          PY
          printf 'NATS_URL=nats://127.0.0.1:%s\n' "${PORT}" >> "${GITHUB_ENV}"

      - name: Run auth passkey register positive proof
        run: pnpm test:proof:auth-passkey-register
        working-directory: apps/web

      - name: Stop JetStream proof container
        if: always()
        shell: bash
        run: |
          if [[ -n "${PASSKEY_NATS_CONTAINER:-}" ]]; then
            docker rm --force "${PASSKEY_NATS_CONTAINER}" > /dev/null 2>&1 || true
          fi

      - name: Upload proof summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: auth-passkey-register-proof-summary
          path: build/proofs/auth-passkey-register/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: auth-passkey-register-proof-report
          path: apps/web/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright traces and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: auth-passkey-register-proof-traces
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY_FILE="build/proofs/auth-passkey-register/proof-summary.json"
          printf '## Auth Passkey Register Positive Proof\n\n' >> "${GITHUB_STEP_SUMMARY}"
          if [ -f "${SUMMARY_FILE}" ]; then
            printf '<details><summary>proof-summary.json</summary>\n\n```json\n' >> "${GITHUB_STEP_SUMMARY}"
            cat "${SUMMARY_FILE}" >> "${GITHUB_STEP_SUMMARY}"
            printf '\n```\n\n</details>\n' >> "${GITHUB_STEP_SUMMARY}"
          else
            printf '%s\n' 'No proof-summary.json produced.' >> "${GITHUB_STEP_SUMMARY}"
          fi
