---
name: Docs Guard

"on":
  push:
    branches:
      - main
      - dev
  pull_request:
    paths:
      - '**/*.md'
      - 'manifest/**'
      - 'architecture/**'
      - 'runtime/**'
      - 'runbooks/**'
      - 'contracts/agent/**'
      - 'scripts/agent/**'
      - 'tests/fixtures/agent/**'
      - 'scripts/contracts-agent-check.sh'
      - 'scripts/docmeta/**'
      - '.wgx/generated-artifacts.yml'
      - '.github/workflows/docs-guard.yml'
      - 'platform/cell-profile.contract.json'
      - 'platform/cell-pilot/**'
      - 'platform/README.md'
      - 'scripts/platform/validate_two_operator_pilot.py'
      - 'scripts/ci/tests/test_two_operator_cell_pilot.py'
      - 'docs/runbooks/**'
      - 'docs/_generated/**'
      - 'docs/proofs/gewebezelle-two-operator-pilot-contract-v1.md'
      - 'Makefile'
      - 'tools/py/**'
      - 'toolchain.versions.yml'
      - 'docs/_generated/system-map.md'
      - 'docs/_generated/report-lifecycle.md'
      - 'docs/_generated/report-lifecycle-inventory.md'
      - 'docs/doc-freshness-registry.yml'
      - 'docs/reports/**'
      - 'docs/process/report-lifecycle.md'
      - 'docs/process/report-lifecycle-contract-alignment.md'
      - 'docs/claims/**'
      - 'docs/_generated/claim-evidence-map.md'
      - 'docs/_generated/agent-readiness.md'
      - 'docs/tasks/index.json'
      - 'docs/tasks/board.md'
      - 'docs/tasks/schema.json'
      - 'docs/reports/optimierungsstatus.json'
      - 'docs/reference/agent-run-evidence-lite.md'
      - 'docs/security/agent-write-scope-baseline.md'
      - 'AGENTS.md'
      - 'repo.meta.yaml'
      - 'agent-policy.yaml'
      - 'audit/impl-registry.yaml'
      - '.python-version'

permissions:
  contents: read

concurrency:
  group: docs-guard-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  blocking-doc-validations:
    name: Blocking doc validations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # provenance: untagged (after v7.0.0)
        with:
          python-version-file: '.python-version'

      - name: Read uv version
        id: uv-version
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION=$(grep '^uv:' toolchain.versions.yml | cut -d '"' -f2)
          if [ -z "${UV_VERSION}" ]; then
            echo "failed to parse uv version from toolchain.versions.yml" >&2
            exit 1
          fi
          printf 'uv_version=%s\n' "${UV_VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # tag: v8.3.2
        with:
          version: ${{ steps.uv-version.outputs.uv_version }}

      - name: Sync hash-locked Python tooling
        run: uv sync --project tools/py --locked

      - name: Rebind report lifecycle provenance for main validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          uv run --project tools/py --locked python -m scripts.docmeta.generate_report_lifecycle
          uv run --project tools/py --locked python -m scripts.docmeta.generate_report_lifecycle_inventory

      - name: Report lifecycle global strict
        run: uv run --project tools/py --locked python -m scripts.docmeta.validate_report_lifecycle --mode strict

      - name: Optimierungsstatus Markdown JSON parity
        run: uv run --project tools/py --locked python -m scripts.docmeta.validate_optimierungsstatus_parity

      - name: Report lifecycle changed-only strict
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          uv run --project tools/py --locked python -m scripts.docmeta.validate_report_lifecycle
          --mode strict
          --changed-from "$BASE_SHA"
          --changed-to "$GITHUB_SHA"

      - name: Test generated artifact control
        run: >-
          uv run --project tools/py --locked python -m unittest
          scripts.docmeta.tests.test_validate_generated_artifacts -v

      - name: run-ci-validate
        run: make ci-validate


  reconcile-report-lifecycle-provenance:
    name: Reconcile report lifecycle provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: blocking-doc-validations
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # provenance: untagged (after v7.0.0)
        with:
          python-version-file: '.python-version'

      - name: Read uv version
        id: reconcile-uv-version
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION=$(grep '^uv:' toolchain.versions.yml | cut -d '"' -f2)
          if [ -z "${UV_VERSION}" ]; then
            echo "failed to parse uv version from toolchain.versions.yml" >&2
            exit 1
          fi
          printf 'uv_version=%s\n' "${UV_VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # tag: v8.3.2
        with:
          version: ${{ steps.reconcile-uv-version.outputs.uv_version }}

      - name: Sync hash-locked Python tooling
        run: uv sync --project tools/py --locked

      - name: Regenerate report lifecycle provenance at exact main head
        run: |
          set -euo pipefail
          uv run --project tools/py --locked python -m scripts.docmeta.generate_report_lifecycle
          uv run --project tools/py --locked python -m scripts.docmeta.generate_report_lifecycle_inventory

      - name: Verify regenerated report lifecycle provenance
        run: |
          set -euo pipefail
          uv run --project tools/py --locked python -m scripts.docmeta.validate_report_lifecycle --mode strict
          uv run --project tools/py --locked python -m scripts.docmeta.generate_report_lifecycle --check
          uv run --project tools/py --locked python -m scripts.docmeta.generate_report_lifecycle_inventory --check
          git diff --check -- docs/_generated/report-lifecycle.md docs/_generated/report-lifecycle-inventory.md

      - name: Publish exact report lifecycle provenance refresh
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          outputs=(
            docs/_generated/report-lifecycle.md
            docs/_generated/report-lifecycle-inventory.md
          )

          if ! git diff --quiet -- . \
            ':(exclude)docs/_generated/report-lifecycle.md' \
            ':(exclude)docs/_generated/report-lifecycle-inventory.md'; then
            echo "unexpected tracked changes outside report lifecycle outputs" >&2
            git diff --name-only -- . \
              ':(exclude)docs/_generated/report-lifecycle.md' \
              ':(exclude)docs/_generated/report-lifecycle-inventory.md' >&2
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "unexpected untracked files after provenance regeneration" >&2
            git ls-files --others --exclude-standard >&2
            exit 1
          fi
          if git diff --quiet -- "${outputs[@]}"; then
            echo "report lifecycle provenance already matches exact main head"
            exit 0
          fi
          if [ "$(git rev-parse HEAD)" != "${TARGET_SHA}" ]; then
            echo "checked-out head differs from triggering main head" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if [ "$(git rev-parse refs/remotes/origin/main)" != "${TARGET_SHA}" ]; then
            echo "main advanced; newer push owns provenance reconciliation"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${outputs[@]}"
          if git diff --cached --quiet; then
            echo "no staged provenance refresh remains"
            exit 0
          fi
          git commit -m "docs: rebind report lifecycle provenance"

          git fetch --no-tags origin main
          if [ "$(git rev-parse refs/remotes/origin/main)" != "${TARGET_SHA}" ]; then
            echo "main advanced after validation; refusing stale provenance push"
            exit 0
          fi
          git push origin "HEAD:refs/heads/main"


  generated-diagnostics:
    name: Generated diagnostics (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: blocking-doc-validations
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # provenance: untagged (after v7.0.0)
        with:
          python-version-file: '.python-version'

      - name: generate-doc-index
        run: bash scripts/docmeta/generate-doc-index.sh

      - name: generate-backlinks
        run: python3 -m scripts.docmeta.generate_backlinks

      - name: generate-orphans
        run: python3 -m scripts.docmeta.generate_orphans

      - name: generate-system-map
        run: python3 -m scripts.docmeta.generate_system_map

      - name: Generate report lifecycle overview
        run: python3 -m scripts.docmeta.generate_report_lifecycle

      - name: generate-report-lifecycle-inventory
        run: python3 -m scripts.docmeta.generate_report_lifecycle_inventory

      # Policy: generated diagnostics are derived observability outputs; drift is reported, not blocking.
      - name: non-blocking generated drift report
        if: always()
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/_generated/; then
            printf 'No generated drift detected after diagnostics generation.\n' > generated-drift-report.txt
          else
            {
              printf 'Generated drift detected (non-blocking).\n\n'
              git --no-pager diff -- docs/_generated/
            } > generated-drift-report.txt
          fi

      - name: annotate-generated-drift
        if: always()
        run: |
          set -euo pipefail
          if grep -q '^Generated drift detected' generated-drift-report.txt; then
            msg="docs/_generated drift detected. See generated-diagnostics artifact."
            echo "::warning title=Generated diagnostics drift::$msg"
          fi

      - name: upload-generated-diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: generated-diagnostics
          path: |
            docs/_generated/doc-index.md
            docs/_generated/backlinks.md
            docs/_generated/orphans.md
            docs/_generated/system-map.md
            docs/_generated/report-lifecycle.md
            docs/_generated/report-lifecycle-inventory.md
            generated-drift-report.txt
          if-no-files-found: ignore
