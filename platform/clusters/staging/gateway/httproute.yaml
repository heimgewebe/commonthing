apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: commonthing-staging
  namespace: commonthing-staging
spec:
  parentRefs:
    - name: commonthing-staging
      namespace: commonthing-staging
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /health
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: commonthing-api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: commonthing-web
          port: 8080
