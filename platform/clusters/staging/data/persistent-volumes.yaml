---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: commonthing-staging-postgres
spec:
  capacity:
    storage: 10Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/local/commonthing-staging/postgres
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - commonthing-staging-worker
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: commonthing-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  volumeName: commonthing-staging-postgres
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: commonthing-staging-nats
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/local/commonthing-staging/nats
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - commonthing-staging-worker
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-data
  namespace: commonthing-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  volumeName: commonthing-staging-nats
  resources:
    requests:
      storage: 5Gi
