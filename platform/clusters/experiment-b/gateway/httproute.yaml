---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: commonthing-experiment-b
  namespace: commonthing-experiment-b
spec:
  parentRefs:
    - name: commonthing-experiment-b
      namespace: commonthing-experiment-b
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /health
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: weltgewebe-api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: weltgewebe-web
          port: 8080
