---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: commonthing-staging
resources:
  - namespace.yaml
  - ../../base
patches:
  - path: config-map-patch.yaml
  - path: replicas-patch.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: commonthing
images:
  - name: ghcr.io/heimgewebe/weltgewebe-api
    newTag: promotion-required
  - name: ghcr.io/heimgewebe/weltgewebe-web
    newTag: promotion-required
