---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-data-egress
spec:
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: commonthing-data
      ports:
        - port: 5432
          protocol: TCP
        - port: 4222
          protocol: TCP
