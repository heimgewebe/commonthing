---
repo_name: commonthing
repo_type: service
role: commonthing-stack
status: active
summary: >
  Aktives Karten- und Koordinationssystem mit kanonischer Zielarchitektur als
  föderiertes commonThing OS; heutige Runtime mit SvelteKit, Rust/Axum,
  PostgreSQL, NATS, Caddy und Compose.

owners:
  - heimgewebe

primary_languages:
  - rust
  - typescript
  - svelte
  - markdown

entrypoints:
  - README.md
  - AGENTS.md
  - docs/index.md

cognitive_modules:
  description: >
    Kognitive Protokolle / Denkwerkzeuge, die nicht Teil der Reading Order sind.
    Sie werden ausschließlich über Aktivierungslogik geladen und angewendet.
    Sie können gleichzeitig kanonische Policies sein, sind jedoch nicht epistemisch verpflichtend zu lesen.
  modules:
    - docs/policies/architecture-critique.md

canonical_sources:
  - agent-contract.json
  - repo.meta.yaml
  - manifest/repo-index.yaml
  - AGENTS.md
  - agent-policy.yaml
  - docs/policies/agent-reading-protocol.md
  - docs/policies/architecture-critique.md
  - architecture/commonthing-os.md
  - platform/README.md
  - docs/specs/federation-core.md
  - docs/specs/map-experience.md
  - docs/specs/ui-interaction.md
  - docs/specs/ui-state-machine.md
  - docs/specs/garnrolle-knoten-faden.md

discovery_roots:
  - .github/workflows/
  - apps/
  - architecture/
  - audit/
  - configs/
  - contracts/
  - docs/
  - infra/
  - platform/
  - policies/
  - scripts/
  - tools/

generated_artifacts:
  - docs/_generated/doc-index.md
  - docs/_generated/system-map.md
  - docs/_generated/orphans.md
  - docs/_generated/impl-index.md
  - docs/_generated/backlinks.md
  - docs/_generated/supersession-map.md
  - docs/_generated/doc-coverage.md
  - docs/_generated/knowledge-gaps.md
  - docs/_generated/implicit-dependencies.md
  - docs/_generated/staleness-report.md
  - docs/_generated/agent-readiness.md
  - docs/_generated/claim-evidence-map.md
  - docs/_generated/relates-to-audit.md
  - docs/_generated/relations-analysis.md
  - docs/_generated/report-lifecycle.md
  - docs/_generated/report-lifecycle-inventory.md

# Compatibility Projection of agent-contract.json for path/check fields below.
# Not an independent authority for agent write scope. Exact parity is enforced
# by scripts/agent/validate_repo_agent_contract.py.
safe_read_paths:
  - agent-contract.json
  - repo.meta.yaml
  - AGENTS.md
  - agent-policy.yaml
  - docs/policies/agent-reading-protocol.md
  - README.md
  - docs/

guarded_write_paths:
  - .github/workflows/
  - .wgx/generated-artifacts.yml
  - agent-contract.json
  - apps/
  - contracts/
  - docs/
  - infra/
  - platform/
  - scripts/

forbidden_write_paths:
  - docs/_generated/
  - secrets/
  - snapshots/

required_checks:
  - repo-structure-guard
  - docs-relations-guard
  - generated-files-guard
  - coverage-guard

indexing:
  enabled: true
  require_frontmatter_for_docs: true
  require_registry_for_critical_impl: false
  fail_on_untyped_docs: true
  fail_on_missing_doc_index: true
  fail_on_orphans: false
  fail_on_unmapped_critical_impl: false

related_repos: []

keywords:
  - weltgewebe-os
  - federation
  - kubernetes
  - local-sovereignty
  - docs
  - agent-ready

agent_reading:
  protocol: docs/policies/agent-reading-protocol.md
  machine_norm: agent-contract.json

truth_model:
  # The canonical machine truth is defined in the precedence array below.
  # Agent path/check authority lives in agent-contract.json; overlapping fields
  # above are a Compatibility Projection only.
  abort_on_conflict: true
  interpolation_allowed: false
  precedence:
    - class: domain_contracts
      paths: ["contracts/domain/*.schema.json"]
    - class: canonical_policies
      paths:
        - "agent-contract.json"
        - "repo.meta.yaml"
        - "AGENTS.md"
        - "agent-policy.yaml"
        - "docs/policies/agent-reading-protocol.md"
        - "docs/policies/architecture-critique.md"
        - "architecture/overview.md"
        - "architecture/commonthing-os.md"
    - class: runtime_configs_and_code
      paths: ["infra/compose/*.yml", "apps/api/src/*", "apps/web/src/*", ".github/workflows/*.yml"]
    - class: normative_specifications
      paths: ["docs/specs/*", "docs/adr/*"]
    - class: diagnostic_reports
      paths: ["docs/reports/*", "docs/proofs/*"]
    - class: planning_material
      paths: ["docs/blueprints/*", "docs/roadmap.md", "docs/tasks/*"]
    - class: navigational_indices
      paths: ["docs/index.md"]
    - class: generated_diagnostics
      paths: ["docs/_generated/*"]

  generated_is_diagnostic_only: true
  index_is_navigation_only: true
