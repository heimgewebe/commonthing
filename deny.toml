[advisories]
version = 2
yanked = "warn"
# pin-utils is unmaintained transitively via hyper; no exploitable defect is reported.
ignore = [{ id = "RUSTSEC-2026-0441", reason = "unmaintained transitive pin-utils via hyper; upstream still depends on it" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Zlib",
  "Unicode-3.0",
  "Apache-2.0 WITH LLVM-exception",
  "0BSD",
  "CDLA-Permissive-2.0",
  "MPL-2.0"
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
