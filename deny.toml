[advisories]
version = 2
yanked = "warn"

# RUSTSEC-2026-0441 reports archived maintenance, not a known exploit.
# pin-utils 0.1.0 is transitive only through hyper 1.7.0 in Cargo.lock.
# Upstream reports no safe upgrade. The sole waiver is constrained to
# that exact direct parent; all other RustSec findings remain blocking.
ignore = [
  { id = "RUSTSEC-2026-0441", allow = ["hyper@1.7.0"], reason = "transitive pin-utils 0.1.0 through hyper 1.7.0 only, no safe upgrade; revisit on Hyper upgrade" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Zlib",
  "Unicode-3.0",
  "Apache-2.0 WITH LLVM-exception",
  "0BSD",
  "CDLA-Permissive-2.0",
  "MPL-2.0"
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
